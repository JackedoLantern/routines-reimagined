<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14805A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health Haven">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Health Haven</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell. Sticky top bar, one view at a time, bottom tab bar on phones, top tabs on desktop. */
:root{
  --bg:#EDF3EF; --surface:#FFFFFF; --surface-2:#E2ECE6; --ink:#0E241D; --ink-2:#4B6359; --line:#D2DFD7;
  --green:#14805A; --on-green:#FFFFFF; --green-soft:#D3EEE0;
  --coral:#EE5A3A; --gold:#D9961A; --gold-soft:#FBEBC4; --danger:#B93A27;
  --sky:#D6ECF3; --grass:#7CC48F; --soil:#C9A27A; --leaf:#2F9A62; --bark:#8A5A3C; --cabin:#EADBC4; --roof:#C8553D; --pond:#7FC3DB;
  --shadow:0 1px 2px rgba(14,36,29,.06),0 10px 28px rgba(14,36,29,.08);
  --font-d:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --r:20px;
}
@supports (transition-timing-function: linear(0, 1)){
  :root{--spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1)}
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1612; --surface:#11211B; --surface-2:#18302A; --ink:#E5F2EB; --ink-2:#9BB4A9; --line:#24392F;
  --green:#3DCB8A; --on-green:#06140E; --green-soft:#173A2C;
  --coral:#FF8466; --gold:#F2BF4E; --gold-soft:#3A2F14; --danger:#FF7A63;
  --sky:#16303A; --grass:#2F7A4C; --soil:#5E4631; --leaf:#3FA86E; --bark:#6E4A33; --cabin:#8C7A62; --roof:#B04A35; --pond:#3C8AA6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1612; --surface:#11211B; --surface-2:#18302A; --ink:#E5F2EB; --ink-2:#9BB4A9; --line:#24392F;
  --green:#3DCB8A; --on-green:#06140E; --green-soft:#173A2C;
  --coral:#FF8466; --gold:#F2BF4E; --gold-soft:#3A2F14; --danger:#FF7A63;
  --sky:#16303A; --grass:#2F7A4C; --soil:#5E4631; --leaf:#3FA86E; --bark:#6E4A33; --cabin:#8C7A62; --roof:#B04A35; --pond:#3C8AA6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{touch-action:manipulation}
/* 16px inputs stop iPhones from zooming in when you tap a box */
input:not(#planTitle),select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;letter-spacing:-.015em;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.mark{width:36px;height:36px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#21A774,#0B5A3E);display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(11,90,62,.3)}
.mark svg{width:26px;height:26px;display:block}
.nav{position:relative;display:flex;gap:2px}
.nav .ind{position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;background:var(--green-soft);transition:transform .55s var(--ease),width .55s var(--ease);z-index:0;pointer-events:none}
.topnav{margin-left:auto}
.topnav button{position:relative;z-index:1;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);transition:color .3s}
.topnav button.on{color:var(--ink)}
.lvlchip{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:13px;white-space:nowrap}
.lvlchip .ring{width:28px;height:28px}
.rkdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px var(--surface)}
.ladder{display:flex;flex-direction:column}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rung:first-child{border-top:0}
.rung .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.rung .medal svg{width:16px;height:16px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rung.got .medal{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor}
.rung.lock{opacity:.5}
.rung.cur b::after{content:'You are here';margin-left:8px;font-size:11px;font-weight:700;color:var(--green);letter-spacing:.04em;text-transform:uppercase}
.lvlchip.bump{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);transition:transform .4s var(--spring)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .nav{justify-content:space-between;max-width:560px;margin:0 auto}
.tabbar .ind{border-radius:14px}
.tabbar button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;font-size:10.5px;font-weight:600;color:var(--ink-2);border-radius:14px;transition:color .3s}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--spring)}
.tabbar button.on{color:var(--green)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.08)}
.topnav{display:none}.lvlchip{margin-left:auto}

/* page */
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tabh,70px) + 110px)}
@media (min-width:820px){.wrap{padding-block:26px calc(var(--tabh,70px) + 110px)}}
.view{display:flex;flex-direction:column;gap:18px}
.view.enter{animation:slidein .55s var(--ease) both}.view.enter.back{animation-name:slideback}
.view.enter>*{animation:rise .75s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.top{view-transition-name:topbar}.tabbar{view-transition-name:tabbar}
.tabbar button:active svg{transform:scale(.8);transition-duration:.15s}
.trig,.tile,.card{transition:transform .5s var(--spring),box-shadow .4s var(--ease)}
@media (hover:hover){.trig:hover,.tile:hover{transform:translateY(-3px)}}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:820px){.grid2{grid-template-columns:1.2fr 1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--surface-2);color:var(--ink);transition:transform .45s var(--spring),background .25s,opacity .25s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--green);color:var(--on-green)}
.btn.gold{background:var(--gold);color:#1E1503}
.btn.ghost{background:transparent;color:var(--ink-2);padding-inline:10px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.warn{background:color-mix(in srgb,var(--coral) 16%,transparent);color:var(--coral)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-size:22px}

/* hero */
.hero{display:grid;grid-template-columns:1fr;gap:18px;align-items:center;padding:22px}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--green)}
.xpbar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.xpbar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,var(--green),color-mix(in srgb,var(--green) 60%,var(--gold)));border-radius:inherit;transition:transform 1s var(--ease)}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.stats-line{display:flex;gap:10px;flex-wrap:wrap}
.flame{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:13.5px}
.flame svg{width:18px;height:18px;fill:currentColor;transform-origin:50% 90%;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}

/* haven */
.haven{width:100%;height:auto;display:block;border-radius:22px;max-width:100%}
.hv{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.1s var(--spring),opacity .6s var(--ease)}
.hv.off{opacity:0;transform:scale(.3) translateY(8px)}
.hv.locked.off{opacity:0}
.glow{animation:twinkle 2.6s ease-in-out infinite}
.glow:nth-child(2n){animation-delay:.8s}.glow:nth-child(3n){animation-delay:1.5s}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}

/* banner */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:var(--green-soft);color:var(--ink)}
.banner p{max-width:62ch}

/* quests */
.quest{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.quest .qbar{grid-column:1/-1;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.quest .qbar i{display:block;height:100%;background:var(--gold);border-radius:inherit;transform-origin:left;transition:transform .9s var(--ease)}
.quest.done .qbar i{background:var(--green)}
.quest .qt{font-weight:600}
.quest.done .qt{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}

/* today workout preview */
.wo-list{list-style:none;margin:12px 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.wo-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-weight:500;min-width:0}
.wo-list li span:last-child{color:var(--ink-2);font-family:var(--font-m);font-size:12.5px;white-space:nowrap}

/* train */
.vpanel{display:flex;flex-direction:column;gap:14px}
.vgroup{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
@media (max-width:560px){.vgroup{grid-template-columns:1fr;gap:6px}}
.vgroup>span{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:13.5px;color:var(--ink-2);transition:background .3s,color .3s,transform .45s var(--spring)}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--ink);color:var(--surface)}
.agebox{display:flex;align-items:center;gap:8px}
.agebox b{font-family:var(--font-m);font-size:18px;min-width:3ch;text-align:center}
.agebox .chip{width:38px;padding:8px 0;text-align:center}
.notes{display:flex;gap:8px;flex-wrap:wrap}
.note{padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);max-width:100%}
.note b{color:var(--ink)}
.progress{display:flex;align-items:center;gap:12px}
.progress .xpbar{flex:1;height:10px}
.wsec{display:flex;flex-direction:column;gap:12px}
.wsec>h3{font-size:15px;font-family:var(--font-b);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.ex{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;transition:background .5s var(--ease),transform .5s var(--spring);min-width:0}
.ex-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.ex-idx{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-m);font-weight:700;font-size:14px;transition:background .5s,color .5s}
.ex h4{font-size:18px;font-weight:700}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cue{margin-top:6px;color:var(--ink-2);font-size:13.5px;max-width:65ch}
.ex.complete{background:color-mix(in srgb,var(--green-soft) 70%,var(--surface))}
.ex.complete .ex-idx{background:var(--green);color:var(--on-green)}
.ex.complete.pop{animation:cardpop .7s var(--spring)}
@keyframes cardpop{0%{transform:scale(1)}30%{transform:scale(1.025)}100%{transform:scale(1)}}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.set{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transition:transform .5s var(--spring)}
.set:active{transform:scale(.88)}
.set svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.set .trk{fill:none;stroke:var(--surface-2);stroke-width:4}
.set .arc{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset .55s var(--ease)}
.set .fill{fill:var(--green);transform-origin:22px 22px;transform:scale(0);transition:transform .5s var(--spring) .12s}
.set .tick{fill:none;stroke:var(--on-green);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .3s}
.set span{position:relative;font-family:var(--font-m);font-weight:700;font-size:15px;transition:opacity .2s,transform .3s}
.set.done .arc{stroke-dashoffset:0}
.set.done .fill{transform:scale(1)}
.set.done .tick{stroke-dashoffset:0}
.set.done span{opacity:0;transform:scale(.6)}
.set.next .trk{stroke:color-mix(in srgb,var(--green) 35%,var(--surface-2))}
.set.next::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);opacity:0;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:0;transform:scale(.94)}50%{opacity:.45;transform:scale(1)}}
.set.just{animation:setpop .6s var(--spring)}
@keyframes setpop{0%{transform:scale(.85)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.swap{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:7px 10px;border-radius:10px;background:var(--surface-2);transition:transform .45s var(--spring)}
.swap:active{transform:scale(.9) rotate(-8deg)}
.swap svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.compare{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:700px){.compare{grid-template-columns:1fr 1fr}}
.cmp{padding:14px;border-radius:16px;background:var(--surface-2);min-width:0}
.cmp b{display:block;font-size:13px;margin-bottom:4px}
.cmp p{font-size:13.5px;color:var(--ink-2)}
::view-transition-group(*){animation-duration:.5s;animation-timing-function:var(--ease)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}

/* import */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px 18px;border-radius:var(--r);border:2px dashed color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green-soft) 45%,var(--surface));transition:transform .45s var(--spring),background .3s;cursor:pointer;overflow:hidden}
.drop.over{transform:scale(1.015);background:var(--green-soft)}
.drop svg{width:44px;height:44px;stroke:var(--green);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop h3{font-size:20px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop.busy::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--green) 22%,transparent),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{to{top:100%}}
.steps{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.step i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);transition:background .3s}
.step.on i{background:var(--gold);animation:breathe2 1s ease-in-out infinite}
.step.ok i{background:var(--green)}
.step.ok{color:var(--ink)}
@keyframes breathe2{50%{transform:scale(1.5)}}
.steps .sep{width:18px;height:2px;background:var(--line);border-radius:2px}
.errbox{padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--coral) 14%,transparent);color:var(--danger);font-weight:600;font-size:14px}
.plans{display:flex;gap:8px;flex-wrap:wrap}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tablewrap{overflow-x:auto;margin-top:12px}
table.rev{width:100%;border-collapse:separate;border-spacing:0 6px;min-width:520px}
table.rev th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding:0 8px;font-weight:700}
table.rev td{padding:0 4px}
table.rev input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:border-color .2s}
table.rev input:focus{border-color:var(--green);outline:none}
table.rev input.num{font-family:var(--font-m);text-align:center}
table.rev tr.unclear input{border-color:color-mix(in srgb,var(--coral) 60%,var(--line))}

/* coach */
.coach{display:flex;flex-direction:column;gap:14px}
.log{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(620px,88%);padding:12px 15px;border-radius:18px;line-height:1.55;animation:msgin .5s var(--spring) both;min-width:0;overflow-wrap:anywhere}
@keyframes msgin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--green);color:var(--on-green);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg p+p,.msg p+ul,.msg ul+p{margin-top:8px}
.msg ul{margin:6px 0 0;padding-left:20px}
.msg li+li{margin-top:3px}
.msg.thinking{color:var(--ink-2)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(var(--tabh,70px) + 4px);background:var(--bg);padding-block:8px}
.composer textarea{flex:1;min-width:0;resize:none;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);max-height:140px;line-height:1.4}
.composer textarea:focus{outline:none;border-color:var(--green)}
.coachhead{display:flex;align-items:center;gap:12px}
.sage{width:46px;height:46px;border-radius:15px;background:var(--green);display:grid;place-items:center;flex:none}
.sage svg{width:28px;height:28px;stroke:var(--on-green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* lazy */
.trigs{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.trigs{grid-template-columns:1fr 1fr}}
.trig{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.trig .habit{font-size:13px;font-weight:600;color:var(--ink-2)}
.trig h3{font-size:19px;font-weight:700}
.trig-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.lvdots{display:inline-flex;gap:3px}
.lvdots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.lvdots i.on{background:var(--gold)}
.did{position:relative;margin-left:auto;padding:10px 18px;border-radius:14px;background:var(--gold);color:#1E1503;font-weight:800;transition:transform .45s var(--spring)}
.did:active{transform:scale(.9)}
.did.burst::after{content:"";position:absolute;inset:0;border-radius:inherit;border:3px solid var(--gold);animation:burst .7s var(--ease) forwards}
@keyframes burst{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.6)}}
.xbtn{font-size:12px;color:var(--ink-2);font-weight:600;padding:4px 6px;border-radius:8px}
.offlist{display:flex;flex-direction:column}
.offrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.offrow:first-child{border-top:0}
.offrow div{min-width:0}
.offrow small{display:block;color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field input,.field textarea,.field select{padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surface);width:100%}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.formgrid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:700px){.formgrid{grid-template-columns:1fr 1fr auto;align-items:end}}

/* rewards */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{padding:16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--font-m);font-size:28px;font-weight:700;letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--ink-2);font-weight:600}
.badges{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);transition:transform .5s var(--spring)}
.badge:hover{transform:translateY(-3px)}
.badge .bi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft)}
.badge .bi svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge b{font-size:14px}
.badge small{font-size:12px;color:var(--ink-2);line-height:1.35}
.badge.locked{opacity:.5;filter:grayscale(1)}
.badge.locked .bi{background:var(--surface-2)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .scrim{position:absolute;inset:0;background:rgba(5,15,11,.45);opacity:0;transition:opacity .4s}
.sheet .panel{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .6s var(--ease);display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:26px;transform:translateY(30px) scale(.97);opacity:0;transition:transform .6s var(--spring),opacity .3s}}
.sheet.show .scrim{opacity:1}
.sheet.show .panel{transform:none;opacity:1}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center;margin-top:-8px}
.sheet h2{font-size:24px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface)}
.sw{width:48px;height:28px;border-radius:999px;background:var(--surface-2);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .45s var(--spring)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}

/* rest dock */
.rest{position:fixed;left:50%;bottom:calc(var(--tabh,70px) + 12px);z-index:40;width:min(440px,calc(100% - 32px));transform:translate(-50%,24px) scale(.94);opacity:0;visibility:hidden;pointer-events:none;transition:transform .6s var(--spring),opacity .3s var(--ease),visibility 0s linear .6s;background:var(--ink);color:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.rest.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .6s var(--spring),opacity .25s var(--ease),visibility 0s}
.rest-in{display:flex;align-items:center;gap:12px}
.rest-in b{font-family:var(--font-m);font-size:26px;min-width:3.2ch}
.rest-in .lbl{flex:1;min-width:0;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-bar{height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px}
.rest-bar i{display:block;height:100%;background:var(--green);transform-origin:left}
.rest .btn{background:rgba(255,255,255,.12);color:var(--surface)}

/* celebrate */
.cele{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px}
.cele .scrim{position:absolute;inset:0;background:rgba(5,15,11,.55);opacity:0;transition:opacity .4s}
.cele-card{position:relative;width:min(420px,100%);background:var(--surface);border-radius:28px;padding:26px 22px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;transform:scale(.7) translateY(30px);opacity:0;transition:transform .8s var(--spring),opacity .3s}
.cele.show .scrim{opacity:1}
.cele.show .cele-card{transform:none;opacity:1}
.cele-card h2{font-size:28px}
.cele-xp{font-family:var(--font-m);font-size:44px;font-weight:700;color:var(--green);line-height:1}
.cele-card .haven{max-width:300px}
.cele-badge{width:84px;height:84px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;animation:spinin 1s var(--spring)}
.cele-badge svg{width:42px;height:42px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes spinin{from{transform:rotateY(180deg) scale(.4)}to{transform:none}}

/* toast + floating xp */
.toasts{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toastin .55s var(--spring) both;text-align:center}
.toast.out{animation:toastout .35s var(--ease) forwards}
@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.fx{position:fixed;z-index:95;pointer-events:none;font-family:var(--font-m);font-weight:700;font-size:15px;color:var(--green);text-shadow:0 1px 0 var(--surface);animation:fxup 1s var(--ease) forwards;transform:translate(-50%,-50%)}
@keyframes fxup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-90%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}

.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const reduced=()=>state.rm||matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
/* ---------- sound effects: synthesized wet pops, drips and chimes (no files) ---------- */
const SFX=(()=>{let ctx=null,mg=null;
 const ac=()=>{try{if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ctx=new A();mg=ctx.createGain();mg.gain.value=.9;const comp=ctx.createDynamicsCompressor();mg.connect(comp);comp.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}};
 const on=()=>state.sound!==false&&!document.hidden;
 function tone({f=600,f2=null,t=0,d=.12,type='sine',v=.18,a=.004}){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d*.9);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0008,s+d);o.connect(g);g.connect(mg);o.start(s);o.stop(s+d+.03)}
 /* a wet "bloop": a quick upward pitch sweep sounds like a water drop or bubble */
 const drop=(t=0,base=480,v=.22)=>{tone({f:base,f2:base*2.7,t,d:.085,v,a:.002});tone({f:base*2.3,f2:base*3.6,t:t+.012,d:.045,v:v*.28,a:.002})};

 const sprinkle=(t,n,v)=>{for(let i=0;i<n;i++)drop(t+i*.055,520+Math.random()*900,v)};
 return {
  set:()=>{if(on())drop(0,420+Math.random()*90)},
  setUndo:()=>{if(on())tone({f:540,f2:280,d:.11,v:.12})},
  exDone:()=>{if(!on())return;drop(0,360);drop(.075,540);tone({f:1320,t:.13,d:.35,v:.07,type:'triangle'})},

  tap:()=>{if(on())drop(0,640,.09)},

  level:()=>{if(!on())return;chime([392,523,659,784,1047,1319],.08,.13);sprinkle(.5,12,.09)},
  badge:()=>{if(!on())return;drop(0,380,.2);chime([1047,1568],.11,.1)},
  rest:()=>{if(!on())return;drop(0,600,.16);drop(.18,600,.16);tone({f:1320,t:.36,d:.45,v:.13,type:'triangle'})},
  send:()=>{if(on())drop(0,520,.14)},
  reply:()=>{if(on())drop(0,760,.1)}
 }})();

const ICON={

 dumbbell:'<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
 upload:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M12.5 17v-6M10 13.5l2.5-2.5 2.5 2.5"/>',
 sage:'<path d="M12 21c-5 0-8-3.5-8-8 0-5 4-9 8-10 4 1 8 5 8 10 0 4.5-3 8-8 8z"/><path d="M12 21V9M12 14l-3-2.5M12 12l3-2.5"/>',

};

/* ---------- exercise library ----------
 flags: k kid-only, K kids and everyone, a adults 18+, h high impact, H heavy lift (6-8 reps),
 x not for 60+, p not in pregnancy, s easier on joints (bonus 40+), o made for older adults */
const LIB=[
 ['bbsq','Barbell back squat','squat','gym','aHx','Brace your core, sit between your hips, drive up through mid-foot','r'],
 ['legpr','Leg press','squat','gym','s','Lower until knees are near 90°, press through your heels','r'],
 ['gobsq','Goblet squat','squat','db','','Hold the dumbbell at your chest, elbows inside your knees','r'],
 ['kbgob','Kettlebell goblet squat','squat','kb','','Hold the bell by the horns, chest tall','r'],
 ['bandsq','Banded squat','squat','bands','','Stand on the band, handles at your shoulders','r'],

function bandOf(a){return a<13?'kid':a<18?'teen':a<40?'adult':a<60?'mid':'senior'}
function ctxOf(p){const band=bandOf(p.age);return {band,age:p.age,eq:EQ[p.equip]||EQ.none,preg:p.gender==='f'&&!!p.preg,gender:p.gender,time:band==='kid'?Math.min(p.time,15):p.time,focus:p.focus||'full',equip:p.equip}}
function allowed(x,c){const f=x.f;
 if(c.band==='kid')return /[kK]/.test(f);
 if(f.includes('k'))return false;
 if(f.includes('a')&&c.age<18)return false;
 if(c.band==='senior'&&/[hx]/.test(f))return false;
 if(c.preg&&/[ph]/.test(f))return false;
 if(c.band==='teen'&&f.includes('H'))return false;
 return c.eq.includes(x.e)}
function score(x,c){let s=0;const f=x.f;
 if(x.e!=='none')s+=3; if(x.e==='gym')s+=1;
 if(f.includes('o'))s+=c.band==='senior'?4:c.band==='mid'?0:-5;
 if(f.includes('s'))s+=c.band==='senior'?2:c.band==='mid'?1:0;
 if(/[hH]/.test(f)&&c.band==='mid')s-=2;
 if(c.band==='kid'&&f.includes('k'))s+=3;
 return s}
function candidates(slot,c,seed,used){return LIB.filter(x=>x.s===slot&&allowed(x,c)&&!used.has(x.id)).sort((a,b)=>score(b,c)-score(a,c)||(hash(a.id+seed)-hash(b.id+seed)))}
function secsFor(x,c){const base={kid:20,teen:30,adult:40,mid:30,senior:20}[c.band];return x.s==='mobility'?30:base}
function repsFor(x,c,warm){
 if(x.u==='s'){const s=warm?30:secsFor(x,c);return s+' sec'+(EACH.has(x.id)?' each side':'')}
 let r={kid:'10',teen:'10',adult:'10–12',mid:'10',senior:'8'}[c.band];
 if(c.band==='adult'&&x.f.includes('H'))r='6–8';
 if(warm)r='8';
 return r+(EACH.has(x.id)?' each side':'')}
function loadFor(x,c){
 if(x.u!=='r')return '';
 const g=c.gender==='m'?'m':c.gender==='f'?'f':'na';
 if(BARBELL.has(x.id)){if(c.band==='teen')return 'Start with the empty bar';return 'Start ~'+{m:'40–60 kg',f:'20–35 kg',na:'25–45 kg'}[g]}
 if(x.e==='gym')return 'Pick a weight you can move cleanly for every rep';
 if(x.e==='db'){if(x.id==='lateral')return 'Start ~'+({m:'4–8',f:'2–4',na:'3–6'}[g])+' kg each';
   if(c.band==='senior')return 'Start ~1–4 kg each'; if(c.band==='teen')return 'Start ~3–6 kg each';
   return 'Start ~'+{m:'8–14',f:'4–8',na:'5–10'}[g]+' kg each'}
 if(x.e==='kb'){if(c.band==='senior')return 'Start ~4–8 kg'; if(c.band==='teen')return 'Start ~6–10 kg';
   return 'Start ~'+{m:'12–16',f:'8–12',na:'8–14'}[g]+' kg'}
 return ''}
function mkItem(x,c,id,slotIdx,swappable,warm){
 const sets=warm?1:Math.min(SETS[c.time]||3,c.band==='senior'||c.band==='kid'?3:9);
 let rest=warm?10:(c.band==='kid'?20:(REST[c.time]||45)+(c.band==='senior'?15:0)+(x.f.includes('H')?30:0));
 return {id:id+'-'+x.id,ex:x.id,name:x.n,cue:x.c,sets,reps:repsFor(x,c,warm),rest,load:warm?'':loadFor(x,c),slotIdx,swappable}}
const AGE_NOTE={kid:'Kid mode: game-style moves, no added weights, 15 minutes max. A grown-up should be nearby.',teen:'Teen mode: bodyweight and light weights with a focus on clean form. No max-effort lifts.',adult:'All moves are open to you. Pick weights that leave 1–2 good reps in the tank.',mid:'40+ mode: longer warm-up, joint-friendly picks and a bit more rest.',senior:'60+ mode: low-impact only, balance work every session. Keep a counter or chair close for support.'};
function genWorkout(p,swaps={}){
 const c=ctxOf(p),seed=todayKey()+c.focus,n=EXN[c.time]||5;
 let slots=SLOTS[c.focus].slice(0,n);
 if(c.band==='senior'&&!slots.includes('balance'))slots[slots.length-1]='balance';
 const used=new Set(),main=[];
 slots.forEach((slot,i)=>{
  let list=candidates(slot,c,seed,used);
  if(!list.length)list=LIB.filter(x=>allowed(x,c)&&!used.has(x.id)&&x.s!=='mobility').sort((a,b)=>score(b,c)-score(a,c)||(hash(a.id+seed+i)-hash(b.id+seed+i)));
  if(!list.length)return;
  const x=list[(swaps[i]||0)%list.length];used.add(x.id);
  main.push(mkItem(x,c,'m'+i,i,list.length>1,false));
 });
 const sections=[];
 if(c.time>=15||c.band==='mid'||c.band==='senior'){const w=candidates('mobility',c,seed+'w',used).slice(0,2);w.forEach(x=>used.add(x.id));if(w.length)sections.push({name:'Warm-up',items:w.map((x,i)=>mkItem(x,c,'w'+i,null,false,true))})}
 sections.push({name:c.time<=15?'Circuit':'Main',items:main});
 if(c.time>=30||c.band==='senior'){const cd=candidates('mobility',c,seed+'c',used).slice(0,2);if(cd.length)sections.push({name:'Cool-down',items:cd.map((x,i)=>mkItem(x,c,'c'+i,null,false,true))})}
 const notes=[AGE_NOTE[c.band]];
 if(c.preg)notes.push('Pregnancy-safe: no lying-on-your-back or high-impact moves. Check with your doctor or midwife before starting.');
 if(c.band==='kid'&&p.equip!=='none')notes.push('Kid mode uses no equipment.');
 if(c.band==='kid'&&p.time>15)notes.push('Trimmed to 15 minutes for kid mode.');
 const fmt=c.time<=15?'Circuit: one round of everything, then repeat':'Straight sets: finish every set of a move before the next';
 return {title:FOCUS_LABEL[c.focus],sub:`${c.time} min · ${EQUIP_LABEL[c.band==='kid'?'none':p.equip]} · ${BAND_LABEL[c.band]}`,fmt,notes,sections,time:c.time}}

function parseRest(s){s=String(s||'');let m=s.match(/(\d+(?:\.\d+)?)\s*(?:-|–|to)?\s*\d*\s*(min|m\b)/i);if(m)return clamp(Math.round(parseFloat(m[1])*60),0,300);m=s.match(/(\d+)/);return m?clamp(+m[1],0,300):60}
function planWorkout(pl,d){const day=pl.days[d];return {title:day.name,sub:pl.title,fmt:'Imported plan',notes:[],time:null,sections:[{name:'Workout',items:day.exercises.map((e,i)=>({id:'p'+i+'-'+hash(e.name).toString(36),name:e.name,cue:e.notes||'',sets:clamp(Math.round(+e.sets)||3,1,10),reps:e.reps||'',rest:parseRest(e.rest),load:'',swappable:false,unclear:!!e.unclear}))}]}}

/* Plan reading without AI: finds days and "3x10" style lines in text PDFs */
const DAY_RE=/^(?:day\s*\d+|(?:mon|tues|wednes|thurs|fri|satur|sun)day|week\s*\d+|workout\s*[a-z0-9]{1,2}\b|session\s*\d+|(?:upper|lower|push|pull|legs?|full[\s-]*body|chest|back|arms|shoulders|core)(?:\s*(?:day|body|workout))?\s*(?:[:\-–(].*)?$)/i;
function parseExLine(l){
 let m=l.match(/^[\d.)•*\-\s]*([A-Za-z][A-Za-z0-9 '’&\/()\-.]{1,50}?)\s*[:\-–,|]?\s*(\d{1,2})\s*(?:x|×|\*|sets?\s*(?:of|x|×)?)\s*(\d{1,3}(?:\s*[-–]\s*\d{1,3})?\s*(?:reps?|sec(?:onds)?|s\b|min(?:utes)?|m\b)?(?:\s*(?:each|per)(?:\s*(?:side|leg|arm))?)?|amrap|max(?:\s*reps)?)(.*)$/i),name,sets,reps,rest0='';
 if(m){name=m[1];sets=+m[2];reps=m[3];rest0=m[4]}
 else if((m=l.match(/^(\d{1,2})\s*(?:x|×)\s*(\d{1,3}(?:\s*[-–]\s*\d{1,3})?)\s+([A-Za-z].{2,50})$/i))){name=m[3];sets=+m[1];reps=m[2]}
 else if((m=l.match(/^[\d.)•*\-\s]*([A-Za-z][A-Za-z '’&\/()\-]{2,50}?)\s+(\d{1,2})\s+(\d{1,3}(?:\s*[-–]\s*\d{1,3})?(?:\s*(?:sec|s|each\s*\w+))?|amrap)\b(.*)$/i))){name=m[1];sets=+m[2];reps=m[3];rest0=m[4]}
 else return null;
 name=name.trim().replace(/[\s:\-–,|]+$/,'');
 if(!name||/^(sets?|reps?|rest|week|day|total|rounds?)$/i.test(name)||sets<1||sets>10)return null;
 let rest='',notes=(rest0||'').trim();const rm=notes.match(/(?:rest[:\s]*)?(\d+(?:\s*[-–]\s*\d+)?\s*(?:sec(?:onds)?|s\b|min(?:ute)?s?|m\b))(?:\s*rest)?/i);
 if(rm){rest=rm[1];notes=notes.replace(rm[0],'')}
 notes=notes.replace(/^[\s,;|\-–:]+|[\s,;|\-–:]+$/g,'');
 return {name,sets,reps:reps.trim(),rest,notes:notes.slice(0,120),unclear:false}}
function parsePlanText(raw){
 const lines=raw.split(/\n+/).map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean),days=[];let cur=null,title='';
 for(const l of lines){const ex=parseExLine(l);
  if(!ex&&l.length<60&&DAY_RE.test(l)){cur={name:l.replace(/[:\-–\s]+$/,''),exercises:[]};days.push(cur);continue}
  if(ex){if(!cur){cur={name:'Workout',exercises:[]};days.push(cur)}cur.exercises.push(ex);continue}
  if(!title&&!days.length&&l.length>3&&l.length<70&&/[a-z]/i.test(l))title=l}
 return normPlan({title:title||'Imported plan',days:days.filter(d=>d.exercises.length)})}

/* ---------- smooth DOM updates: patch in place so bars and counters glide instead of flashing ---------- */
function patchAttrs(x,y){for(const a of [...x.attributes])if(!y.hasAttribute(a.name))x.removeAttribute(a.name);for(const a of y.attributes)if(x.getAttribute(a.name)!==a.value)x.setAttribute(a.name,a.value);if((x.tagName==='INPUT'||x.tagName==='SELECT')&&document.activeElement!==x&&x.value!==y.value)x.value=y.value}
function patchKids(a,b){const ac=[...a.childNodes],bc=[...b.childNodes];
 bc.forEach((y,i)=>{const x=ac[i];
  if(!x){a.appendChild(y);return}
  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&(x.getAttribute('data-key')||'')!==(y.getAttribute('data-key')||''))){a.replaceChild(y,x);return}
  if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
  if(x.tagName==='TEXTAREA'&&document.activeElement===x)return;
  patchAttrs(x,y);patchKids(x,y)});
 for(let i=ac.length-1;i>=bc.length;i--)ac[i].remove()}
function morph(el,html){const t=document.createElement('div');t.innerHTML=html;patchKids(el,t)}
const V={set today(h){morph($('#view-today'),h)},set lazy(h){morph($('#view-lazy'),h)},set rewards(h){morph($('#view-rewards'),h)},set import(h){morph($('#view-import'),h)}};

/* swipe left or right to change tabs; the page follows your finger */
(()=>{let sx=0,sy=0,dx=0,t0=0,active=false,lock=null,el=null;const main=$('main');
 main.addEventListener('touchstart',e=>{active=false;if(e.touches.length!==1||e.target.closest('input,textarea,select,.tablewrap,.daytabs,.plans,.seg,.agebox'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;t0=performance.now();lock=null;el=$('#view-'+ui.curView);active=!!el},{passive:true});
 main.addEventListener('touchmove',e=>{if(!active)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
  if(lock===null){if(Math.abs(x)<10&&Math.abs(y)<10)return;lock=Math.abs(x)>Math.abs(y)*1.3?'x':'y'}
  if(lock!=='x')return;dx=x;const i=VIEWS.indexOf(ui.curView),edge=(dx>0&&i===0)||(dx<0&&i===VIEWS.length-1),d=edge?dx*.22:dx*.9;
  el.classList.remove('enter','back');el.style.transition='none';el.style.transform=`translateX(${d}px)`;el.style.opacity=String(1-Math.min(.4,Math.abs(d)/800))},{passive:true});
 const end=()=>{if(!active||lock!=='x'){active=false;return}active=false;const i=VIEWS.indexOf(ui.curView),v=Math.abs(dx)/Math.max(1,performance.now()-t0),n=(Math.abs(dx)>80||(v>.45&&Math.abs(dx)>30))?(dx<0?i+1:i-1):i;
  if(n!==i&&n>=0&&n<VIEWS.length){el.style.transition='transform .18s var(--ease),opacity .18s';el.style.transform=`translateX(${dx<0?-90:90}px)`;el.style.opacity='0';buzz(8);const t=el;setTimeout(()=>{t.style.cssText='';go(VIEWS[n])},150)}
  else{el.style.transition='transform .55s var(--spring),opacity .3s';el.style.transform='';el.style.opacity='';const t=el;setTimeout(()=>{t.style.transition=''},560)}};
 main.addEventListener('touchend',end);main.addEventListener('touchcancel',end)})();
/* no pinch or double-tap zoom: keeps it feeling like an app */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<300&&!e.target.closest('input,textarea'))e.preventDefault();lastTouchEnd=now},{passive:false});

 try{const db=await window.claude.use('db');const u=await window.claude.use('user');const id=u?await u.id():null;
  if(db&&id){const ref=db.doc('data/users/'+id+'/state');const snap=await ref.get();remote=ref;
   if(snap.exists){const d=snap.data();if(d&&d.s&&(d.t||0)>(state.t||0)){try{state=migrate(JSON.parse(d.s));document.documentElement.classList.toggle('rm',!!state.rm);try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}renderAll();renderTrain();renderCoach()}catch(e){}}}
   else save()}}catch(e){}
