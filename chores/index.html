<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PEPE CHORES</title>
<meta name="description" content="Family chores that rotate every month. Earn XP, climb the leaderboard, unlock 55 badges.">
<meta name="theme-color" content="#0a0a0b"><meta name="color-scheme" content="dark">

<script src="../supabase.js"></script>
<style>:root{--bg:#0a0a0b;--bg2:#121214;--card:#17171a;--card2:#1e1e22;--line:#2b2b31;--grey:#8d8d96;--grey2:#5c5c64;--text:#f4f2ef;--o:#ff7a00;--o2:#ffad5a;--o3:#ff9a2e;--oglow:rgba(255,122,0,.45);--red:#e3241b;--red2:#ff5a4a;--ok:#ff9a2e;
  --f-d:"Big Shoulders Display","Oswald",Impact,sans-serif;--f-b:"Figtree",system-ui,-apple-system,sans-serif;--f-m:"DM Mono",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--f-b);min-height:100%;overscroll-behavior:none}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% -10%,#2a1400 0%,rgba(10,10,11,0) 55%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 14px calc(92px + var(--sab))}
.app.noTabs{padding-bottom:calc(30px + var(--sab))}
/* header */
.hdr{position:sticky;top:0;z-index:30;margin:0 -14px;padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(#0a0a0bf2,#0a0a0bd9 70%,#0a0a0b00);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{font:900 23px/1 var(--f-d);letter-spacing:.06em;display:flex;gap:1px;flex:1;min-width:0}
.brand i{font-style:normal;display:inline-block;animation:bWave 3.2s ease-in-out infinite;color:var(--text)}
.brand i:nth-child(odd){color:var(--o)}
.brand i.dot{color:var(--red)}
@keyframes bWave{0%,70%,100%{transform:none}80%{transform:translateY(-4px) scale(1.08)}90%{transform:translateY(1px)}}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;min-width:0;max-width:60%}
.me-chip .av{width:34px;height:34px;flex:none}
.me-chip b{font:800 15px/1 var(--f-d);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.me-chip small{font:500 10px/1.2 var(--f-m);color:var(--grey);display:block;white-space:nowrap}
.xpbar{height:6px;border-radius:9px;background:#26262b;overflow:hidden;margin-top:3px;width:84px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2));border-radius:9px;box-shadow:0 0 10px var(--oglow);transition:width .8s cubic-bezier(.2,1,.3,1)}
/* views */
.view{animation:vIn .38s cubic-bezier(.2,1,.3,1)}
.view.l{animation-name:vInL}.view.r{animation-name:vInR}
@keyframes vIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vInL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
@keyframes vInR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-d);letter-spacing:.03em;margin:0;line-height:1.05}
h1{font-size:40px;font-weight:900}h2{font-size:28px;font-weight:900}h3{font-size:20px;font-weight:800}
.ttl{display:inline-block;animation:ttl 4s ease-in-out infinite}
@keyframes ttl{0%,100%{transform:scale(1);text-shadow:0 0 0 transparent}50%{transform:scale(1.03);text-shadow:0 0 18px var(--oglow)}}
.ico{display:inline-block;animation:icoB 3s ease-in-out infinite}
@keyframes icoB{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(-4deg)}}
.lbl{font:600 11px/1.2 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.note{color:var(--grey);font-size:13px}
.card{background:linear-gradient(180deg,var(--card),#141416);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;position:relative;overflow:hidden}
.card.hot{border-color:#5a2a00;background:linear-gradient(160deg,#2a1300,#151516 60%)}
.card.hot::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-100%);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn:active{transform:scale(.95)}
.btn.p{background:linear-gradient(180deg,var(--o3),var(--o));border-color:#ff9a3c;color:#140800;box-shadow:0 6px 22px -6px var(--oglow);animation:btnGlow 2.8s ease-in-out infinite}
@keyframes btnGlow{0%,100%{box-shadow:0 6px 22px -8px var(--oglow)}50%{box-shadow:0 6px 30px -4px var(--oglow)}}
.btn.red{background:#2a0d0b;border-color:#5a1612;color:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
.inp,select.inp,textarea.inp{width:100%;background:#0f0f11;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;transition:border-color .2s,box-shadow .2s;min-height:46px}
.inp:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,122,0,.18)}
label.f{display:block;margin:10px 0 0}label.f>span{display:block;margin-bottom:5px}
/* start screens */
.start{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:calc(20px + var(--sat)) 0 20px}
.start .big{font:900 clamp(52px,18vw,110px)/.9 var(--f-d);letter-spacing:.04em;text-align:center;white-space:nowrap}
.start .big i{font-style:normal;display:inline-block;animation:bigIn .7s cubic-bezier(.2,1.6,.4,1) both,bWave 3.2s ease-in-out infinite}
.start .tagline{text-align:center;color:var(--grey);margin-bottom:12px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);cursor:pointer;width:100%;transition:transform .15s,border-color .2s}
.choice:active{transform:scale(.97)}.choice:hover{border-color:#5a2a00}
.choice .ci{font-size:30px;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:#231204;flex:none;animation:icoB 3s ease-in-out infinite}
.choice b{font:800 20px/1.1 var(--f-d);letter-spacing:.03em;display:block}.choice small{color:var(--grey)}
@keyframes bigIn{from{transform:translateY(40px) scale(.3) rotate(-14deg);opacity:0}}
.slot{display:flex;gap:8px;align-items:center;margin:8px 0}
.slot .num{font:900 22px var(--f-d);color:var(--o);width:22px;text-align:center}
.slot .inp{flex:1}
.chore-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;background:#1f1206;border:1px solid #4a2300;font-weight:700;font-size:13px;white-space:nowrap;flex:none;min-width:104px}
.chore-chip .e{font-size:18px;display:inline-block;animation:icoB 2.6s ease-in-out infinite}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;font-size:14px;transition:all .2s}
.pill.on{background:var(--o);border-color:var(--o);color:#140800;transform:scale(1.04)}
/* chores */
.hero{display:flex;gap:14px;align-items:center}
.hero .big-e{font-size:46px;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#4a2300,#1a0d02);border:1px solid #5a2a00;flex:none;animation:heroE 2.4s ease-in-out infinite}
@keyframes heroE{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.1) rotate(-6deg)}60%{transform:scale(1.04) rotate(4deg)}}
.ring{width:74px;height:74px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{fill:none;stroke:#28282d;stroke-width:8}.ring .b{fill:none;stroke:url(#gO);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,1,.3,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font:900 20px var(--f-d)}
.task{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:8px 0;cursor:pointer;user-select:none;transition:background .25s,border-color .25s,transform .12s;position:relative}
.task:active{transform:scale(.98)}
.task .cb{width:34px;height:34px;border-radius:11px;border:2px solid var(--grey2);flex:none;display:grid;place-items:center;transition:all .25s;background:#0f0f11}
.task .cb svg{width:22px;height:22px;stroke:#140800;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30}
.task.done{background:linear-gradient(90deg,#2a1300,#17171a);border-color:#5a2a00}
.task.done .cb{background:var(--o);border-color:var(--o);box-shadow:0 0 16px var(--oglow)}
.task.done .cb svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s .18s ease-out}
.task.done .tt{color:var(--o2)}
.task.wait .cb{border-color:var(--o);border-style:dashed;animation:waitSpin 3s linear infinite}
@keyframes waitSpin{to{transform:rotate(360deg)}}
.task .tt{font-weight:700}.task small{display:block;color:var(--grey);font-size:12px;font-weight:500}
.task .xp{font:800 15px var(--f-d);color:var(--o);letter-spacing:.04em}
.task.locked{opacity:.55}
.task.pop{animation:tPop .62s cubic-bezier(.3,1.6,.4,1)}
@keyframes tPop{0%{transform:scale(1)}18%{transform:scale(1.06)}38%{transform:scale(.95) translateY(3px)}58%{transform:scale(.97) translateY(3px)}82%{transform:scale(1.03) translateY(-3px)}100%{transform:none}}
.banner{padding:12px 14px;border-radius:14px;background:#2a0d0b;border:1px solid #5a1612;color:#ffc9c2;font-size:14px;margin:10px 0}
.banner.o{background:#241204;border-color:#5a2a00;color:#ffd3a6}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 4px}
/* ranks */
.emb{width:120px;height:120px;display:block;margin:0 auto}
.emb.sm{width:36px;height:36px;margin:0}
.emb .spin{transform-origin:50px 50px;animation:embSpin 9s linear infinite}
@keyframes embSpin{to{transform:rotate(360deg)}}
.emb-wrap{position:relative;display:grid;place-items:center;padding:8px 0}
.emb-wrap::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,122,0,.16) 0 8deg,transparent 8deg 22deg);animation:embSpin 14s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%)}
.emb-wrap .emb{animation:embPulse 2.6s ease-in-out infinite;position:relative}
@keyframes embPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.bigxp{text-align:center;font:900 46px/1 var(--f-d);letter-spacing:.03em;margin-top:6px}
.bigxp span{color:var(--o)}
.lvlbar{height:14px;border-radius:9px;background:#222226;overflow:hidden;margin:10px 0 4px;border:1px solid var(--line)}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--o) 40%,var(--o2));box-shadow:0 0 16px var(--oglow);position:relative;transition:width 1s cubic-bezier(.2,1,.3,1)}
.lvlbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.6s ease-in-out infinite}
.seg{display:flex;background:#111113;border:1px solid var(--line);border-radius:13px;padding:3px;position:relative;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--grey);position:relative;z-index:1;transition:color .25s}
.seg button.on{color:#140800}
.seg .ind{position:absolute;top:3px;bottom:3px;border-radius:10px;background:var(--o);transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:6px 0;animation:lbIn .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes lbIn{from{opacity:0;transform:translateX(-18px)}}
.lb .pos{font:900 22px var(--f-d);width:30px;text-align:center;color:var(--grey)}
.lb.p1 .pos{color:var(--o)}.lb.p2 .pos{color:#c9c9cf}.lb.p3 .pos{color:#c96f2e}
.lb.p1{border-color:#6a3200;background:linear-gradient(90deg,#2a1300,#17171a)}
.lb.mine{box-shadow:inset 0 0 0 2px var(--o)}
.lb b{font-weight:700}.lb .x{font:800 17px var(--f-d);color:var(--o);letter-spacing:.03em}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tier{text-align:center;padding:8px 2px;border-radius:12px;background:#121214;border:1px solid var(--line);font-size:11px;cursor:pointer}
.tier.lock{opacity:.35;filter:grayscale(1)}
.tier .emb{width:44px;height:44px}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.bdg{text-align:center;padding:10px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;perspective:500px;transition:transform .15s}
.bdg:active{transform:scale(.94)}
.bdg svg{width:62px;height:62px;display:block;margin:0 auto 4px;transform-style:preserve-3d}
.bdg.got svg{animation:bFloat 3.4s ease-in-out infinite}
.bdg:nth-child(3n) svg{animation-delay:-1.2s}.bdg:nth-child(3n+1) svg{animation-delay:-2.3s}
@keyframes bFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.05)}}
.bdg.lock{opacity:.5}.bdg.lock svg{filter:grayscale(1) brightness(.55)}
.bdg b{display:block;font-size:12px;line-height:1.15}.bdg small{font-size:10px;color:var(--grey);display:block;line-height:1.2;margin-top:2px}
.bdg svg.flip{animation:coin 1.1s cubic-bezier(.3,.7,.4,1)!important}
@keyframes coin{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-70px) rotateY(900deg) scale(1.2)}75%{transform:translateY(0) rotateY(1440deg) scale(.95)}88%{transform:translateY(-8px) rotateY(1440deg)}100%{transform:translateY(0) rotateY(1440deg)}}
/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));z-index:40;width:min(540px,calc(100% - 20px));display:flex;background:rgba(20,20,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 12px 40px -10px #000}
.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;border-radius:16px;cursor:pointer;color:var(--grey);font:700 11px/1.1 var(--f-b);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:1;transition:color .3s}
.tabs button .ti{font-size:22px;transition:transform .35s cubic-bezier(.3,1.6,.4,1)}
.tabs button.on{color:#140800}.tabs button.on .ti{transform:scale(1.15) translateY(-1px)}
.tabs .ind{position:absolute;top:6px;bottom:6px;border-radius:16px;background:linear-gradient(180deg,var(--o3),var(--o));box-shadow:0 0 22px -2px var(--oglow);transition:left .45s cubic-bezier(.3,1.25,.5,1),width .45s;overflow:hidden}
.tabs .ind::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:indShine 4.5s ease-in-out infinite}
@keyframes indShine{0%,75%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.badge-dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/16px var(--f-b);padding:0 4px}
/* overlays */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s}
.ov .box{width:min(440px,100%);max-height:calc(100dvh - 40px);overflow:visible;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;background:linear-gradient(180deg,#1b1b1f,#131315);border:1px solid #3a2a1e;border-radius:24px;padding:22px;text-align:center;animation:boxIn .5s cubic-bezier(.2,1.5,.4,1);position:relative}
.ov .box.left{text-align:left}
.ov .eyebrow{font:600 11px var(--f-m);letter-spacing:.2em;color:var(--o);text-transform:uppercase}
.ov h2{margin:6px 0}
@keyframes fade{from{opacity:0}}
@keyframes boxIn{from{transform:scale(.6) translateY(30px);opacity:0}}
.rays{position:absolute;inset:0;overflow:hidden;border-radius:24px;pointer-events:none}
.rays::before{content:"";position:absolute;left:50%;top:110px;width:460px;height:460px;margin:-230px;background:repeating-conic-gradient(rgba(255,122,0,.18) 0 10deg,transparent 10deg 24deg);border-radius:50%;animation:embSpin 10s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%)}
.ov .big-n{font:900 84px/1 var(--f-d);color:var(--o);text-shadow:0 0 30px var(--oglow);animation:bigN 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes bigN{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25)}}
.toast{position:fixed;left:50%;top:calc(12px + var(--sat));z-index:90;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#1c1c20;border:1px solid #5a2a00;border-radius:16px;padding:10px 14px;box-shadow:0 14px 40px -10px #000;width:max-content;max-width:calc(100% - 24px);animation:tIn .5s cubic-bezier(.2,1.5,.4,1)}
.toast .e{font-size:26px}.toast b{display:block}.toast span{font-size:12px;color:var(--grey)}
@keyframes tIn{from{transform:translate(-50%,-80px)}}
.float{position:fixed;z-index:85;pointer-events:none;font:900 26px var(--f-d);color:var(--o);text-shadow:0 0 16px var(--oglow),0 2px 0 #000;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:84;width:100%;height:100%}
/* parent */
.kid{display:flex;gap:12px;align-items:center}
.kid .av{width:46px;height:46px;flex:none}
.mini{height:8px;border-radius:9px;background:#26262b;overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;background:var(--o);border-radius:9px}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222226;cursor:pointer}
.sw:last-child{border-bottom:0}
.sw .grow b{display:block;font-weight:700}.sw .grow small{color:var(--grey);font-size:12px;display:block}
.sw input[type=checkbox]{appearance:none;width:50px;height:30px;border-radius:99px;background:#2a2a30;position:relative;flex:none;cursor:pointer;transition:background .25s}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw input[type=checkbox]:checked{background:var(--o)}.sw input[type=checkbox]:checked::after{transform:translateX(20px)}
.sw .inp{width:auto;min-width:96px;min-height:38px;padding:7px 10px}
.code{font:900 42px/1 var(--f-d);letter-spacing:.22em;color:var(--o);text-align:center;padding:10px;border:2px dashed #5a2a00;border-radius:16px;margin:8px 0;animation:ttl 3s ease-in-out infinite}
.inbox-i{display:flex;gap:10px;padding:12px;border-radius:14px;background:#141416;border:1px solid var(--line);margin:6px 0}
.inbox-i.new{border-color:#6a3200;background:#1f1105}
.inbox-i .e{font-size:22px}
.rep{width:100%;border-collapse:collapse;font-size:14px}.rep td,.rep th{padding:8px 6px;border-bottom:1px solid #232327;text-align:left}.rep th{font:600 11px var(--f-m);color:var(--grey);letter-spacing:.1em;text-transform:uppercase}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;background:#26262b;color:var(--grey)}
.tag.o{background:#3a1c02;color:var(--o2)}.tag.r{background:#3a0f0c;color:var(--red2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* line icons */
.i{width:1.2em;height:1.2em;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.big-e .i,.choice .ci .i{width:60%;height:60%;color:var(--o);stroke-width:1.7;filter:drop-shadow(0 0 8px var(--oglow))}
.chore-chip .e .i,.chore-chip .i{color:var(--o)}
.tabs .ti .i{width:24px;height:24px}
.tabs button.on .ti .i{stroke-width:2.3}
.toast .e .i{width:28px;height:28px;color:var(--o)}
.inbox-i .e .i{color:var(--o);width:24px;height:24px}
.ov .big-n .i{width:84px;height:84px;stroke-width:1.6}
.lb>span:first-child .i,.row>span .i{color:var(--o)}
.banner .i{color:inherit}
.brand{align-items:baseline}
.brand .pepe{font:900 13px/1 var(--f-d);letter-spacing:.16em;color:var(--o);background:#241204;border:1px solid #5a2a00;border-radius:7px;padding:4px 6px 3px;margin-right:6px;align-self:center;animation:ttl 3.5s ease-in-out infinite}
.pepe-big{display:flex;align-items:center;justify-content:center;gap:8px;font:900 28px/1 var(--f-d);letter-spacing:.3em;color:var(--o);margin-bottom:-6px}
.pepe-big .i{width:42px;height:42px;stroke-width:1.6;animation:heroE 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px var(--oglow))}
.emb.rank-ico{overflow:visible}.emb .spin{transform-origin:32px 32px}
.legend .spin{animation:embSpin 6s linear infinite}
.sq{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:3px}

.ov .box::-webkit-scrollbar,.app::-webkit-scrollbar{display:none;width:0;height:0}

.bell{position:relative;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--o)}
.bell .i{width:22px;height:22px}.bell.ring .i{animation:bellR 1.4s ease-in-out infinite;transform-origin:50% 10%}

.ov .box.left,.ov.scroll .box{overflow-x:hidden;overflow-y:auto}

/* no scrollbars anywhere (still scrolls by swipe/wheel) */
html,body,*{scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
.ov{overflow:hidden}

.hdr{gap:8px}.me-chip{max-width:44%}.brand .pepe{font-size:11px;padding:3px 5px 2px;margin-right:5px}
@media(max-width:360px){.brand .dot{display:none}.me-chip .xpbar{width:60px}}
.brand{position:relative;padding-top:9px;font-size:25px}
.brand .pepe{position:absolute;top:0;left:1px;font-size:10px;line-height:1;letter-spacing:.42em;padding:0;margin:0;background:none;border:0;color:var(--o)}

const DISH_Q=[['dw','Is the dishwasher clean?','If yes, unloading it is the first thing on your list.'],['ct','Is there stuff on the counter?','If yes, you clear it off after the dishwasher.'],['sk','Is the sink full of dishes?','If yes, you load them after the counter.']];

  await SB.from('ch_progress').upsert({user_id:uidv,family_id:f.id,name:nm,slot:myslot>=0?myslot:null,xp:mine.xp,level:lvlOf(mine.xp),data:{me:mine,shared},updated_at:new Date().toISOString()});
  if(myslot>=0){const R=rulesFor(myslot);if(R.hideGlobal)await SB.from('ch_board').delete().eq('user_id',uidv);else await SB.from('ch_board').upsert({user_id:uidv,handle:(nm||'Player').slice(0,14),xp:mine.xp,level:lvlOf(mine.xp),streak:mine.streak,updated_at:new Date().toISOString()})}}
const isParentAcct=()=>online()&&fam()&&(fam().parents||[]).some(p=>p.pid===C.cloud.uid);
async function cloudNote(n){if(!famOnline()||n.to===C.me.pid)return;if(n.to==='parent'&&isParent())return;await SB.from('ch_notes').insert({family_id:fam().id,to_role:n.to==='parent'?'parent':'child',kind:n.kind,title:n.title,body:n.body,data:{...(n.data||{}),to:n.to}})}
let pulling=false;
async function cloudPull(force){if(!online()||pulling)return false;pulling=true;try{const u=C.cloud.uid;
  const {data:mem}=await SB.from('ch_members').select('*').eq('user_id',u);const act=(mem||[]).find(m=>m.status==='active'),pend=(mem||[]).find(m=>m.status==='pending');
  if(!act){if(pend){STEP='pending';C.pending=C.pending||{id:pend.family_id,name:'the family'};render()}return false}
  const [{data:fr},{data:ms},{data:pr}]=await Promise.all([SB.from('ch_families').select('*').eq('id',act.family_id).single(),SB.from('ch_members').select('*').eq('family_id',act.family_id),SB.from('ch_progress').select('*').eq('family_id',act.family_id)]);
  if(!fr)return false;const meta=(fr.rules||{})._meta||{},rules={...(fr.rules||{})};delete rules._meta;
  const old=fam()&&fam().code===fr.code?fam():null;
  const f={id:fr.id,code:fr.code,name:fr.name,startMonth:fr.start_month,slots:(fr.slots||[]).map(s=>({name:s.name||'',pid:s.pid})),rules,goals:fr.goals||[],contact:fr.contact||{},approvals:fr.approvals||{},reportTime:meta.reportTime||'19:00',pin:meta.pin||'',parents:[]};
  while(f.slots.length<4)f.slots.push({name:''});
  for(const m of ms||[]){if(m.status!=='active')continue;if(m.role==='parent')f.parents.push({pid:m.user_id,name:m.name||'Parent'});else if(m.slot!=null&&f.slots[m.slot]){f.slots[m.slot].pid=m.user_id;if(!f.slots[m.slot].name)f.slots[m.slot].name=m.name}}
  if(!old&&C.fam&&!C.fam.code&&C.me){/* local family replaced by cloud one: keep local progress for my slot */const lp=C.me.pid;if(act.slot!=null)migratePid('s'+act.slot,u);else if(lp)migratePid(lp,u)}
  const jr=(ms||[]).filter(m=>m.status==='pending');C.joinSeen=C.joinSeen||{};for(const m of jr)if(!C.joinSeen[m.user_id]&&act.role==='parent'){C.joinSeen[m.user_id]=1;C.fam=f;C.me={pid:u,role:'parent',slot:null};setTimeout(()=>notifyParents('join',`${m.name||'Someone'} wants to join`,'Open Family to let them in and pick parent or kid.'),50)}
  C.fam=f;C.joinReq=jr;
  if(isParent()||act.role==='parent'){}
  C.me={pid:u,role:act.role,slot:act.role==='parent'?null:act.slot};if(C.me.role!=='parent'&&C.me.slot==null){C.me.role='child';C.me.slot=f.slots.findIndex(s=>s.pid===u)}
  if(C.me.role==='child'&&(C.me.slot==null||C.me.slot<0)){C.me.slot=0}
  for(const r of pr||[]){const d=r.data||{};if(r.user_id===u){const mine=C.prog[u];if(!mine||(d.me&&d.me.xp>mine.xp&&force))C.prog[u]=d.me||mine||prog(u)}else if(d.me)C.prog[r.user_id]=d.me;
    if(r.user_id!==u)for(const k in d.shared||{}){const cur=C.prog[k];if(!cur||d.shared[k].xp>=cur.xp)C.prog[k]=d.shared[k]}}
  // parent notifications
  {const since=C.noteSince||new Date(Date.now()-864e5).toISOString();const {data:ns}=await SB.from('ch_notes').select('*').eq('family_id',f.id).gt('created_at',since).order('created_at',{ascending:true}).limit(80);const par=C.me.role==='parent';
    for(const n of ns||[]){if(C.inbox.find(x=>x.cid===n.id)||n.from_user===u)continue;const to=(n.data&&n.data.to)||(n.to_role==='parent'?'parent':'kids');if(par?n.to_role!=='parent':(n.to_role==='parent'||(to!=='kids'&&to!==u&&to!=='s'+C.me.slot)))continue;
      if(n.kind==='code'&&n.data){C.kidCodes=C.kidCodes||{};C.kidCodes[(n.data.name||'').toLowerCase()]=n.data.code}
      const item={id:uid(),cid:n.id,at:Date.parse(n.created_at),kind:n.kind,title:n.title,body:n.body,data:n.data,to:par?'parent':(to==='kids'?'kids':u),from:n.from_user,read:false};C.inbox.unshift(item);if(C.noteSince){SFX.notify();sysNotify(n.title,n.body||'','ch-'+n.kind+n.id);toast(NK[n.kind]||'🔔',n.title,n.body||'')}}
    C.noteSince=ns&&ns.length?ns[ns.length-1].created_at:(C.noteSince||new Date(Date.now()-6e5).toISOString())}
  if(STEP==='pending'){STEP=null;TAB=null;SFX.allDone();confetti(1.2);toast('🎉','You’re in!',`Welcome to ${f.name}`);setTimeout(()=>{notifyParents('join',`${C.me&&personOf(C.me.pid)?.name||'New member'} joined the family`,'They can start doing chores now.');if(C.me.role==='child'){const ch=choreFor(f,C.me.slot);notifyKid(C.me.pid,'welcome',`Welcome! Your chore is ${ch.n}`,`You’re in ${f.name}. Do your chore to earn XP.`)}},300)}
  save();applyApprovals();unseenGoals();if(!$('.ov')&&!document.activeElement?.matches('input,textarea,select'))render();return true}
  catch(e){console.warn(e);return false}finally{pulling=false}}
async function cloudAdmit(user,yes){if(!famOnline())return;const f=fam();
  if(!yes){await SB.from('ch_members').delete().eq('family_id',f.id).eq('user_id',user);SFX.uncheck()}
  else{const role=$(`[data-jrole="${user}"]`).value,sv=$(`[data-jslot="${user}"]`).value,slot=sv===''?null:+sv,m=(C.joinReq||[]).find(x=>x.user_id===user);
    const {error}=await SB.from('ch_members').update({status:'active',role,slot:role==='child'?slot:null}).eq('family_id',f.id).eq('user_id',user);if(error){toast('⚠️','Couldn’t let them in',error.message);return}
    if(role==='child'&&slot!=null){if(!f.slots[slot].name)f.slots[slot].name=m?.name||'';f.slots[slot].pid=user;await famPush()}SFX.allDone();confetti(.8);toast('✅','They’re in!',`${m?.name||'New member'} joined as a ${role}.`)}
  await cloudPull(true)}
async function cloudWorld(){if(!online())return;const {data}=await SB.from('ch_board').select('*').order('xp',{ascending:false}).limit(50);C.world=data||[];render()}
async function cloudRename(v){if(!famOnline())return;await SB.from('ch_members').update({name:v}).eq('family_id',fam().id).eq('user_id',C.cloud.uid).then(()=>{},()=>{});cloudPush(true)}
async function cloudSignOut(kid){try{await cloudPush(true);await SB.auth.signOut()}catch(e){}const wasKid=kid||(C.cloud&&C.cloud.kid);C.cloud=null;if(wasKid){C.fam=null;C.me=null;STEP='start'}save();toast('👋','Logged out',wasKid?'Log back in with your name and login code.':'Your family stays on this device.');render()}

/* ================= boot ================= */
fxInit();sbInit();
document.addEventListener('pointerdown',()=>SFX.unlock(),{once:true});
render();
setTimeout(()=>{maybeReport();maybeRemind();if(C.me&&!isParent()){checkBadges(C.me.pid);unseenGoals()}},3800);
if(window.CH_STANDALONE&&'serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script>
<script>(function(){if(location.protocol==='file:')return;let busy=false;async function check(){if(busy||document.visibilityState!=='visible')return;busy=true;try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).v;if(v&&v!==window.CH_VERSION){let t='';try{t=sessionStorage.getItem('ch-upd')||''}catch(e){}if(t===v)return;try{sessionStorage.setItem('ch-upd',v)}catch(e){}const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.value)return;try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}location.reload()}}catch(e){}finally{busy=false}}addEventListener('load',()=>setTimeout(check,2000));document.addEventListener('visibilitychange',check)})();</script>
