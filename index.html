<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Routines Reimagined</title>
<meta name="description" content="Daily workouts, routines, diet and Skeefo, your coach. Earn XP, keep streaks, level up.">
<meta name="theme-color" content="#09090A">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routines">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.RR_STANDALONE=true;</script>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, "night gym" — black and graphite surfaces stay quiet so gold XP and violet level are the only things that glow */
:root{
  --bg:#09090A; --surface:#121214; --surface-2:#1A1A1D; --raise:#202024;
  --ink:#F1F1F3; --muted:#8B8B93; --faint:#5C5C64; --line:#232327; --line-2:#2E2E33;
  --accent:#ECECEE; --accent-ink:#09090A; --accent-soft:#1E1E22;
  --gold:#FFC53D; --gold-2:#FF8A1F; --gold-soft:#241D0D; --gold-glow:rgba(255,197,61,.45);
  --lvl:#A98BFF; --lvl-2:#6E5BFF; --lvl-soft:#1C1730; --lvl-glow:rgba(169,139,255,.5);
  --flame:#FF6B2C; --flame-soft:#26150D;
  --good:#FFC53D; --good-soft:#1F1A0E; --bad:#FF5C67; --bad-soft:#2A1214;
  --board:#09090A; --board-ink:#F1F1F3; --board-muted:#8B8B93; --board-line:#232327;
  --heat0:#1A1A1D; --heat1:#3B3015; --heat2:#8A6A1C; --heat3:#FFC53D;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lvl);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- Scoreboard ---------- */
.board{position:relative;overflow:hidden;background:
  radial-gradient(420px 220px at 8% 10%,var(--lvl-soft),transparent 70%),
  radial-gradient(380px 200px at 100% 100%,var(--gold-soft),transparent 70%),var(--bg);
  border-bottom:1px solid var(--line)}
.board .wrap{padding-block:20px 24px;display:grid;gap:18px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1;color:var(--ink)}
.brand h1 span{color:var(--muted)}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.lvl{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,var(--lvl-soft) 0 55%,transparent 72%)}
.lvl svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.lvl circle{fill:none;stroke-width:4}
.lvl .trk{stroke:var(--line-2)}
.lvl .bar{stroke:var(--lvl);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--lvl-glow));transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.lvl b{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;color:var(--lvl);text-shadow:0 0 18px var(--lvl-glow)}
.lvl small{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--lvl);color:#0B0817;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.12em;padding:2px 7px;border-radius:5px;box-shadow:0 0 12px var(--lvl-glow)}
.who{min-width:0;display:grid;gap:8px}
.who .title{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.04em;line-height:1;color:var(--ink)}
.who .title::before{content:"Rank · ";color:var(--lvl);font-size:.62em;letter-spacing:.12em;vertical-align:middle}
.xpbar{height:12px;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:visible;position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));border-radius:6px;box-shadow:0 0 14px var(--gold-glow);transition:width 1s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:sheen 3s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.xptext{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.xptext b{color:var(--gold);font-weight:500;text-shadow:0 0 10px var(--gold-glow)}
.streak{display:grid;justify-items:center;gap:2px;min-width:64px}
.streak .fl{width:32px;height:38px}
.streak b{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.streak span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fl path{transform-origin:50% 100%}
.streak.live .fl{filter:drop-shadow(0 0 8px rgba(255,107,44,.5))}
.streak.live .fl .o{fill:var(--flame);animation:flick 1.4s ease-in-out infinite}
.streak.live .fl .i{fill:#FFD46B;animation:flick 1s ease-in-out infinite reverse}
.streak.cold .fl .o{fill:var(--line-2)} .streak.cold .fl .i{fill:var(--faint)}
.streak.cold b{color:var(--muted)}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.94,1.06)}}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:8px}
.tab{border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
main .wrap{padding-block:20px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main .wrap>*{min-width:0}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.banner b{display:block;font-weight:700;color:var(--ink)}
.banner.ok .dot{background:var(--gold);box-shadow:0 0 10px var(--gold-glow)}
.banner.warn .dot{background:var(--flame);box-shadow:0 0 10px rgba(255,107,44,.5)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))} .banner.bad .dot{background:var(--bad);box-shadow:0 0 10px rgba(255,92,103,.5)}
.banner.info .dot{background:var(--lvl);box-shadow:0 0 10px var(--lvl-glow)}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.banner .act{margin-left:auto;flex:none}

.btn{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;transition:transform .12s,background .2s,border-color .2s}
.btn:hover{border-color:var(--faint)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.day{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.day h2{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:4px 9px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.chip.xp{color:var(--gold);background:var(--gold-soft)}
.ring{width:88px;height:88px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:7}
.ring .trk{stroke:var(--surface-2)}
.ring .bar{stroke:var(--gold);stroke-linecap:round;filter:drop-shadow(0 0 5px var(--gold-glow));transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--f-display);font-weight:900;font-size:24px}
.ring.full b{color:var(--gold)}
.ring span{font-family:var(--f-mono);font-size:10px;color:var(--muted);display:block;margin-top:3px}
.dayfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}

/* ---------- Fold (shared expand animation) ---------- */
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.fold>div{overflow:hidden;min-height:0}
.chev{width:16px;height:16px;flex:none;transition:transform .3s}
.chev path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.guide{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.guide-h{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;padding:16px 20px;text-align:left}
.guide-h b{display:block;font-size:16px}
.guide.open .fold{grid-template-rows:1fr}
.guide.open .guide-h .chev{transform:rotate(180deg)}
.guide .fold>div{padding:0 20px}
.guide.open .fold>div{padding-bottom:18px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:block;position:relative;padding-left:34px;min-height:22px;font-size:14px;color:var(--muted)}
.steps li b{color:var(--ink)}
.steps li::before{position:absolute;left:0;top:0;content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--ink)}

/* ---------- Exercises ---------- */
.block{display:grid;gap:8px}
.block-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.block-h h3{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ex{display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden;transition:border-color .3s,background .3s}
.ex::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--gold-soft),transparent 85%);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:0}
.ex>*{position:relative;z-index:1}
.ex:hover{border-color:var(--line-2)}
.ex.done{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.ex.done::before{transform:scaleX(1)}
.ex.done .exn{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--gold) 80%,transparent);text-decoration-thickness:2px}
.chk{width:42px;height:42px;border-radius:13px;border:2px solid var(--line-2);background:var(--surface-2);display:grid;place-items:center;padding:0;transition:border-color .2s,background .2s,box-shadow .3s}
.chk:hover{border-color:var(--gold)}
.chk svg{width:22px;height:22px}
.chk path{fill:none;stroke:#120E04;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .08s ease-out}
.ex.done .chk{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px var(--gold-glow)}
.ex.done .chk path{stroke-dashoffset:0}
.ex.pop .chk{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.exinfo{min-width:0;display:grid;gap:1px;text-align:left;border:0;background:transparent;padding:4px 0}
.exn{font-weight:700;font-size:15px}
.cue{font-size:13px;color:var(--muted)}
.howlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--lvl);margin-top:3px}
.ex.open .howlink .chev{transform:rotate(180deg)}
.dose{text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.dose small{display:block;font-size:11px}
.xpv{color:var(--gold)}
.how{grid-column:1/-1}
.how>div{padding-left:56px}
.ex.open .how{grid-template-rows:1fr}
.ex.open .how>div{padding-top:12px;padding-bottom:4px}
.how .note{margin:10px 0 0;font-family:var(--f-mono);font-size:12px}
.locked .chk{cursor:default}

.done-card{text-align:center;background:radial-gradient(400px 180px at 50% 0%,var(--gold-soft),transparent 80%),var(--surface);border-color:color-mix(in srgb,var(--gold) 30%,var(--line))}
.done-card h2{font-family:var(--f-display);font-weight:900;font-size:42px;text-transform:uppercase;line-height:1;margin-top:6px}
.done-card p{color:var(--muted);margin:8px 0 0}
.done-card .big{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--gold);text-shadow:0 0 16px var(--gold-glow);margin-top:10px}

/* ---------- Progress ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1.05;margin-top:4px}
.stat.xp b{color:var(--gold);text-shadow:0 0 14px var(--gold-glow)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.heat .h{aspect-ratio:1;border-radius:7px;background:var(--heat0);max-width:100%;position:relative}
.heat .h.l1{background:var(--heat1)} .heat .h.l2{background:var(--heat2)} .heat .h.l3{background:var(--heat3);box-shadow:0 0 10px var(--gold-glow)}
.heat .h.today{outline:2px solid var(--lvl);outline-offset:2px}
.heat .h.fut{background:transparent;border:1px dashed var(--line-2)}
.heat .dn{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center}
.legend{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:14px}
.badge{display:grid;justify-items:center;gap:6px;text-align:center}
.badge svg{width:56px;height:62px}
.badge:not(.off) svg{filter:drop-shadow(0 0 8px var(--gold-glow))}
.badge .bn{font-size:12px;font-weight:700;line-height:1.2}
.badge .bd{font-size:11px;color:var(--muted);line-height:1.25}
.badge.off svg{opacity:.5}
.badge.off .bn{color:var(--muted)}
.rules{display:grid;gap:12px;margin:14px 0 0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;color:var(--muted)}
.rules li span{font-family:var(--f-display);font-weight:900;font-size:20px;color:var(--lvl);line-height:1.2}
.ladder{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.rung{flex:1 0 74px;border-radius:12px;padding:8px 10px;background:var(--surface-2);font-size:12px}
.rung b{display:block;font-family:var(--f-display);font-size:16px;text-transform:uppercase;color:var(--muted)}
.rung.me{background:var(--lvl-soft);box-shadow:inset 0 0 0 1px var(--lvl),0 0 14px var(--lvl-glow)}
.rung.me b{color:var(--lvl)}

/* ---------- Leaderboard ---------- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.lb{display:grid;gap:6px;margin-top:16px}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--surface-2);animation:rowin .45s both}
@keyframes rowin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.row .rk{font-family:var(--f-display);font-weight:900;font-size:24px;text-align:center;color:var(--faint)}
.row.p1 .rk{color:var(--gold);text-shadow:0 0 12px var(--gold-glow)} .row.p2 .rk{color:#C9CBD3} .row.p3 .rk{color:#C98A5A}
.row.me{background:var(--lvl-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lvl) 60%,transparent)}
.row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12px;color:var(--muted)}
.row .sub .lv{color:var(--lvl);font-weight:600}
.row .val{font-family:var(--f-display);font-weight:900;font-size:24px;text-align:right;color:var(--gold)}
.row .val small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;color:var(--muted)}
.empty{text-align:center;padding:28px 8px;color:var(--muted);font-size:14px}

/* ---------- Profile ---------- */
.form{display:grid;gap:20px}
.field{display:grid;gap:8px}
.field>label,.field>.lab{font-weight:700;font-size:14px}
.inp{border:1px solid var(--line-2);background:var(--surface-2);border-radius:11px;padding:11px 12px;width:100%}
.inp:focus{border-color:var(--lvl);outline:none;box-shadow:0 0 0 3px var(--lvl-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;padding:8px 13px;border-radius:11px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;font-weight:600;color:var(--muted);transition:all .15s}
.opt input:checked+span{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.opt input:focus-visible+span{outline:2px solid var(--lvl);outline-offset:2px}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--gold)}
.range output{font-family:var(--f-mono);min-width:56px;text-align:right}
.hint{font-size:12px;color:var(--muted)}

/* ---------- Effects ---------- */
.float{position:fixed;pointer-events:none;z-index:50;font-family:var(--f-display);font-weight:900;font-size:24px;color:var(--gold);text-shadow:0 0 14px var(--gold-glow)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(5,5,6,.86);padding:24px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov{text-align:center;color:var(--ink);display:grid;gap:10px;justify-items:center;max-width:360px}
.ov .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ov .huge{font-family:var(--f-display);font-weight:900;font-size:150px;line-height:.9;position:relative}
.ov h2{font-family:var(--f-display);font-weight:800;font-size:32px;text-transform:uppercase}
.ov p{color:var(--muted);margin:0}
.rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;z-index:-1;
  background:repeating-conic-gradient(from 0deg,rgba(169,139,255,.28) 0 8deg,transparent 8deg 22deg);
  border-radius:50%;mask:radial-gradient(circle,#000 18%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 18%,transparent 70%);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.lvlup .eyebrow{color:var(--lvl)}
.lvlup .huge{animation:slam .7s cubic-bezier(.2,1.4,.4,1) both;color:var(--lvl);text-shadow:0 0 40px var(--lvl-glow)}
.lvlup h2{color:var(--ink)}
@keyframes slam{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
.lvldown .eyebrow{color:var(--bad)}
.lvldown .huge{color:var(--bad);text-shadow:0 0 30px rgba(255,92,103,.4);animation:drop .9s cubic-bezier(.5,0,.6,1.4) both}
@keyframes drop{0%{transform:translateY(-60px) rotate(-6deg);opacity:0}60%{transform:translateY(8px) rotate(3deg);opacity:1}75%{transform:translateX(-6px)}85%{transform:translateX(5px)}100%{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:70;background:var(--raise);color:var(--ink);border:1px solid var(--line-2);border-radius:16px;padding:10px 16px 10px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.2,1.3,.4,1);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:40px;height:44px;flex:none}
.toast b{display:block;font-size:14px}
.toast span{font-size:12px;color:var(--muted)}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.18)}}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .badges{grid-template-columns:repeat(3,1fr)}
  .day h2{font-size:30px}
  .score{gap:12px}
  .lvl{width:70px;height:70px} .lvl b{font-size:32px}
  .who .title{font-size:20px}
  .ex{column-gap:10px;padding:10px 12px}
  .how>div{padding-left:0}
  .ov .huge{font-size:116px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Shared bits for planner, parent and Skeefo ---------- */
.tabs .wrap{grid-template-columns:repeat(5,1fr)}
.h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;margin-top:2px}
.chip.lv{color:var(--lvl);background:var(--lvl-soft)}
.chip.sk{color:#0B0817;background:linear-gradient(90deg,var(--lvl),var(--gold))}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-style:dashed}
.icon-btn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font-size:13px;display:grid;place-items:center}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--lvl-soft);color:var(--lvl);vertical-align:2px;margin-left:4px;text-decoration:none}
.late{color:var(--flame);font-weight:600}
.live{color:var(--gold);font-family:var(--f-mono);font-weight:500}
.pulse{display:block;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 var(--gold-glow);animation:pulse 1.6s infinite;margin-right:8px}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.exinfo.static{padding:2px 0}
.ex.task .cue{font-size:12.5px}
.ex.task.ro{grid-template-columns:76px 1fr auto}
.slot{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1}

/* ---------- Schedule editor ---------- */
.ed-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ed{display:grid;gap:14px;margin-top:14px}
.ed-sec{display:grid;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)}
.ed-row{display:flex;gap:8px;align-items:center}
.inp.sec{font-weight:700;background:var(--surface)}
.ed-tasks{display:grid;gap:6px}
.ed-task{display:grid;grid-template-columns:1fr 112px 86px 36px;gap:6px;align-items:center}
.ed-task .inp{background:var(--surface);padding:8px 10px;min-width:0}
.inp.ro{color:var(--muted);font-size:14px}
.minbox{position:relative}
.minbox .inp{padding-right:34px}
.minbox span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{position:absolute;opacity:0}
.switch span{width:38px;height:22px;border-radius:11px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked+span{background:var(--lvl)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--lvl);outline-offset:2px}

/* ---------- Parent report ---------- */
.rep-w{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--gold-soft);color:var(--gold)}
.pill.mid{background:var(--flame-soft);color:var(--flame)}
.pill.no{background:var(--surface-2);color:var(--muted)}
.tl{display:grid;margin-top:10px}
.tl-row{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.tl-row:last-child{border-bottom:0}
.tl-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-2)}
.tl-row.done .tl-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold-glow)}
.tl-right{text-align:right;display:grid;justify-items:end;gap:3px}
.tl-right small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tl-right .muted{color:var(--muted);font-weight:500}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:grid;justify-items:center;gap:4px;padding:10px 2px;border-radius:12px;background:var(--surface-2);text-align:center}
.wd i{font-style:normal;font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--faint)}
.wd.on{background:var(--gold-soft)} .wd.on i{color:var(--gold);text-shadow:0 0 10px var(--gold-glow)}
.wd small{font-size:10px;color:var(--muted);line-height:1.2}

/* ---------- Skeefo ---------- */
.sk-head{display:flex;align-items:center;gap:14px}
.sk-head>.btn{margin-left:auto}
.sk-av{flex:none;filter:drop-shadow(0 0 14px var(--lvl-glow));animation:bob 4s ease-in-out infinite}
.sk-av .eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
.sk-av.think svg{animation:think 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes think{50%{transform:rotate(-6deg) scale(1.04)}}
.chat{display:grid;gap:12px;padding:4px 0}
.bubble{display:flex;gap:10px;align-items:flex-end;animation:rowin .35s both}
.bubble.u{justify-content:flex-end}
.bubble.u .txt{background:var(--accent);color:var(--accent-ink);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:min(80%,460px);white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.a .av{flex:none;align-self:flex-start}
.bwrap{min-width:0;max-width:min(88%,520px);display:grid;gap:8px}
.bubble.a .txt{background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:11px 14px;overflow-wrap:anywhere}
.bubble.a .txt ul{margin:6px 0;padding-left:18px}
.bubble.a .txt b{color:var(--ink)}
.bubble.err .txt{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));color:var(--muted)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--lvl);animation:dots 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.attach{background:var(--surface);border:1px solid color-mix(in srgb,var(--lvl) 35%,var(--line));border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:0 0 24px rgba(169,139,255,.08)}
.plan-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.plan-days>div{background:var(--surface-2);border-radius:10px;padding:8px;display:grid;gap:2px}
.plan-days b{font-size:13px;line-height:1.2}
.plan-days small{font-size:11px;color:var(--muted)}
.applied{font-weight:700;color:var(--gold)}
.sched-sec{display:grid;gap:4px}
.sched-sec>b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--lvl)}
.sched-t{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:13.5px}
.sched-t span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.sched-t small{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip-btn{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);transition:border-color .2s,background .2s}
.chip-btn:hover{border-color:var(--lvl)}
.chip-btn[data-act="buildplan"],.chip-btn[data-act="buildsched"]{border-color:color-mix(in srgb,var(--lvl) 55%,transparent);color:var(--lvl)}
.chip-btn:disabled{opacity:.4}
.composer{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.composer:focus-within{border-color:var(--lvl)}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;padding:7px 0;max-height:140px;line-height:1.4}
.send{flex:none;width:38px;height:38px;border-radius:12px;border:0;background:var(--lvl);display:grid;place-items:center;box-shadow:0 0 14px var(--lvl-glow)}
.send svg{width:20px;height:20px}
.send path{fill:none;stroke:#0B0817;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.send:disabled{opacity:.4;box-shadow:none}

@media (max-width:560px){
  .tab{font-size:12.5px;padding:9px 2px}
  .ed-task{grid-template-columns:1fr 1fr 36px}
  .ed-task>:first-child{grid-column:1/-1}
  .week{gap:4px}
  .wd small{font-size:9px}
}

/* ---------- Typing text: always white ---------- */
input,textarea,select,.inp,.composer textarea{color:#FFFFFF;caret-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
.bubble.u .txt{background:linear-gradient(135deg,#2A2340,#1E1A2E);color:#FFFFFF;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lvl) 40%,transparent)}

/* ---------- Skeefo ↔ Claude link card ---------- */
.card.link{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.card.link .lk-text{min-width:0}
.card.link .lk-text b{display:block;font-size:16px;margin-top:2px}
.card.link .note{margin:4px 0 0}
.card.link.prompt,.card.link.denied,.card.link.signedout{border-color:color-mix(in srgb,var(--lvl) 45%,var(--line));background:radial-gradient(360px 160px at 0% 50%,var(--lvl-soft),transparent 75%),var(--surface)}
.card.link.granted{border-color:color-mix(in srgb,var(--gold) 30%,var(--line))}
.card.link.compact{padding:12px 16px}
.card.link.compact.granted .note{display:none}
.card.link.compact .lk-text b{font-size:14px}
.lk-icons{display:flex;align-items:center;gap:6px}
.lk-cl{width:34px;height:34px;border-radius:11px;background:var(--raise);box-shadow:inset 0 0 0 1px var(--line-2);display:grid;place-items:center}
.lk-cl svg{width:20px;height:20px}
.lk-cl circle,.lk-cl path{fill:none;stroke:#FFFFFF;stroke-width:2;stroke-linecap:round}
.lk-line{width:26px;height:4px;border-radius:2px;background:var(--line-2);position:relative;overflow:hidden}
.lk-line i{position:absolute;inset:0;background:linear-gradient(90deg,var(--lvl),var(--gold));transform:translateX(-100%)}
.card.link.prompt .lk-line i,.card.link.checking .lk-line i{animation:lkpulse 1.6s ease-in-out infinite;transform:none}
.lk-line.on i{transform:none;box-shadow:0 0 10px var(--gold-glow)}
.card.link.just .lk-line i{animation:lkfill .6s cubic-bezier(.2,.8,.2,1) both}
.card.link.just .lk-icons{animation:pop .6s .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes lkpulse{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes lkfill{from{transform:translateX(-100%)}to{transform:none}}
a.btn{display:inline-block;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
@media (max-width:560px){.card.link{grid-template-columns:auto 1fr}.card.link .lk-act{grid-column:1/-1}.card.link.compact .lk-act{grid-column:auto}}
.brain{display:inline-block;vertical-align:middle;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:6px;text-transform:uppercase}
.brain.cl{background:linear-gradient(90deg,var(--lvl),var(--gold));color:#0B0817}
.card.link.compact:not(.granted){background:var(--surface);border-color:var(--line)}
.hdr-r{display:flex;align-items:center;gap:10px}
.snd{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0;transition:border-color .2s,transform .15s}
.snd:hover{border-color:var(--gold)}
.snd:active{transform:scale(.9)}
.snd svg{width:18px;height:18px}
.snd path{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd .spk{fill:var(--gold)}
.snd .x{display:none}
.snd.off path{stroke:var(--muted)} .snd.off .spk{fill:var(--muted)}
.snd.off .w{display:none} .snd.off .x{display:block}

/* ---------- Dark scrollbars everywhere ---------- */
html,:root{color-scheme:dark!important}
html{scrollbar-color:#34343A #09090A}
*{scrollbar-color:#34343A transparent}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-track{background:#09090A}
*:not(html)::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2A2F;border-radius:8px;border:2px solid #09090A}
*:not(html)::-webkit-scrollbar-thumb{border-color:transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#3C3C44}
::-webkit-scrollbar-thumb:active{background:var(--lvl)}
::-webkit-scrollbar-corner{background:#09090A}
.ladder,.chips,.composer textarea{scrollbar-width:thin}
.brand h1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rab{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-decoration:none;color:#0B0817;background:linear-gradient(90deg,var(--lvl),var(--gold));padding:3px 7px;border-radius:6px;box-shadow:0 0 12px var(--lvl-glow)}
.kidbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip-btn.on{background:var(--lvl);color:#0B0817;border-color:var(--lvl)}
.fam-hero{background:radial-gradient(420px 160px at 100% 0%,var(--lvl-soft),transparent 75%),var(--surface)}
.fam-hero .note{margin:10px 0 0}
.kav{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;background:linear-gradient(135deg,var(--lvl),var(--gold));color:#0B0817}
.kav.big{width:48px;height:48px;font-size:24px;border-radius:15px}
.card.kid{display:grid;gap:12px}
.kid-top{display:flex;gap:12px;align-items:center}
.kid-n{font-size:18px}
.kid-today,.rule-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.row-act{display:flex;gap:6px}
.card.kid .dayfoot{margin-top:0;flex-wrap:wrap}
.rules-ed{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.switch.rule{align-items:flex-start;color:var(--ink)}
.switch.rule span{margin-top:2px}
.switch.rule b{display:block;font-size:14px}
.switch.rule small{display:block;color:var(--muted);font-size:12px}
select.inp{appearance:auto}
.brand h1 .logo{width:34px;height:34px;flex:none;margin-right:-2px;animation:logoIn .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes logoIn{from{transform:rotate(-120deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.tabs .wrap{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:68px;white-space:nowrap;padding-inline:10px}
.tab.mine{color:color-mix(in srgb,var(--lvl) 70%,var(--muted))}
.tab.add{flex:0 0 auto;min-width:44px;font-size:20px;line-height:1;color:var(--lvl);border:1px dashed color-mix(in srgb,var(--lvl) 50%,transparent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
.glass{border:0;background:transparent;padding:0;display:grid;place-items:center}
.glass svg{width:100%;max-width:40px;height:auto;aspect-ratio:3/4}
.glass .g-out{fill:none;stroke:var(--line-2);stroke-width:2;stroke-linejoin:round}
.glass .g-in{fill:#4FB6FF;opacity:0;transform:scaleY(0);transform-origin:50% 100%;transform-box:fill-box;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.glass.full .g-in{opacity:1;transform:none;filter:drop-shadow(0 0 6px rgba(79,182,255,.5))}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fg-b{text-align:left;border:1px solid var(--line-2);background:var(--surface-2);border-radius:14px;padding:12px;display:grid;gap:2px;transition:all .2s}

.fg-b.on{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 0 14px var(--gold-glow)}

textarea.notes{resize:vertical;margin-top:8px;line-height:1.5}
@media (max-width:560px){.fg{grid-template-columns:1fr}.glasses{gap:3px}}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--lvl-soft);border:1px solid color-mix(in srgb,var(--lvl) 45%,transparent);font-size:13px;color:var(--muted)}
.pv-bar b{color:var(--lvl)}
.mem-note{text-align:center;margin:0}
.linkbtn{border:0;background:none;padding:0;color:var(--lvl);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.wrapchips{flex-wrap:wrap;overflow:visible;margin-top:10px}
.dp-week{display:grid;gap:6px;margin-top:12px}
.dp-day{background:var(--surface-2);border-radius:12px;padding:10px 12px}

function md(t){

function buildRoutine(p,date,variant){
  const wd=(parseKey(date).getDay()+6)%7;
  const plan=PLANS[p.goal]||PLANS.general;
  let [title,cycle,recovery]=plan[wd];
  const r=rng(hash(date+'|'+variant+'|'+p.goal+p.level+p.equip+p.age+p.minutes));
  const eqOK=p.equip==='gym'?['none','db','gym']:p.equip==='db'?['none','db']:['none'];
  const age=+p.age||28;
  const ok=e=>eqOK.includes(e.eq)&&allowedEx(e)&&!(age<18&&e.heavy)&&!(age>=55&&e.imp)&&!(age>=45&&p.level==='beginner'&&e.imp)&&!(p.level==='beginner'&&e.hard)&&!(p.level==='advanced'&&e.easy&&e.t!=='min'&&r()<.6);
  const used=new Set();
  const pick=focus=>{let f=focus,easyOnly=false;if(focus==='cardioE'){f='cardio';easyOnly=true}
    let pool=EX.filter(e=>e.f===f&&ok(e)&&!used.has(e.id)&&(!easyOnly||e.easy));
    if(!pool.length)pool=EX.filter(e=>e.f===f&&e.eq==='none'&&!used.has(e.id)&&!e.imp);
    if(!pool.length)return null;
    if(p.equip!=='none'&&r()<.65){const q=pool.filter(e=>e.eq!=='none');if(q.length)pool=q}
    const e=pool[Math.floor(r()*pool.length)];used.add(e.id);return e};
  let main=[],fromAI=false;
  const ai=variant===0&&S.aiPlan&&S.aiPlan.days&&S.aiPlan.days[wd];
  if(ai&&ai.ex&&ai.ex.length){
    fromAI=true;title=ai.title||title;recovery=!!ai.recovery;
    main=ai.ex.filter(x=>EXI[x.id]&&allowedEx(EXI[x.id])).map(x=>{used.add(x.id);const it=item(EXI[x.id],p,false);if(x.sets)it.sets=x.sets;if(x.dose)it.dose=x.dose;return it});
  }else{
    let n=Math.max(3,Math.min(9,Math.round((p.minutes-8)/4.5)));if(recovery)n=Math.max(3,n-2);
    for(let i=0;i<n;i++){const e=pick(cycle[i%cycle.length]);if(e)main.push(item(e,p,false))}
    if(age>=55&&!used.has('balance')){main.push(item(EXI.balance,p,false));used.add('balance')}
  }
  const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
  const warm=shuffle(WARM.filter(x=>!used.has(x))).slice(0,age>=40?3:2).map(id=>item(EXI[id],p,true));
  const cool=shuffle(COOL.filter(x=>!used.has(x))).slice(0,age>=40?2:1).map(id=>item(EXI[id],p,true));
  const rest={muscle:90,fat:30,endurance:30,mobility:20,general:60}[p.goal]||60;
  return{title,recovery:!!recovery,rest,fromAI,blocks:[{k:'warm',name:'Warm-up',items:warm},{k:'main',name:recovery?'Recovery work':'Main set',items:main},{k:'cool',name:'Cool-down',items:cool}]};
}
function item(e,p,side){
  const age=+p.age||28,g=p.goal;
  let sets=side?1:{beginner:2,intermediate:3,advanced:4}[p.level]||2;
  if(age>=55&&!side)sets=Math.max(2,sets-1);
  if(age<18&&!side)sets=Math.min(sets,3);
  let dose;
  if(e.t==='min'){const m={fat:15,endurance:20}[g]||10;dose=`${age>=55?Math.round(m*.8):m} min`;sets=1}
  else if(e.t==='time'){let s=side?40:({muscle:30,fat:40,endurance:45,mobility:45,general:30}[g]||30);if(age>=55)s-=10;if(p.level==='advanced'&&!side)s+=15;dose=`${s} s`}
  else dose=side?'10 reps':({muscle:'8–12',fat:'12–15',endurance:'15–20',mobility:'8–10',general:'10–12'}[g]||'10–12')+' reps';
  return{id:e.id,n:e.n,cue:e.cue,sets,dose,xp:side?XP_SIDE:XP_MAIN};
}

}

    workout:{title:R.title,done:S.today.done.length,total:items.length,complete:!!S.today.complete,start:S.today.start||0,end:S.today.end||0,time:(sc.sections.flatMap(s=>s.tasks).find(k=>k.kind==='workout')||{}).time||''},

function tweenXP(to,hi,who){
  const el=$('#xpText');const from=shownXP??to;shownXP=to;
  const fmt=v=>`${who?esc(who)+' · ':''}<b>${Math.round(v).toLocaleString()}</b> XP · ${(hi-Math.round(v)).toLocaleString()} to level ${lvl(to)+1}`;
  if(reduced||from===to){el.innerHTML=fmt(to);return}
  const t0=performance.now(),d=700;
  const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.innerHTML=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

  busy=true;S.chat.push({r:'u',t:'Build my workout plan'});const a={r:'a',t:'',pending:1};S.chat.push(a);render();scrollChat();
  const lib=EX.map(e=>`${e.id} | ${e.n} | ${e.f} | equipment:${e.eq}${e.imp?' | high-impact':''}${e.heavy?' | heavy':''}${e.hard?' | advanced':''}${e.easy?' | easy':''}`).join('\n');
  const prompt=`${persona()}

Conversation so far:
${transcript()}

TASK: Build a 7-day workout plan (Monday first) for this person from what you know. Fill gaps with sensible defaults from their profile. Use ONLY exercise ids from this library (id | name | focus | equipment). Don't use equipment they don't have. Under 18: no "heavy" moves. 55+: no "high-impact" moves. Beginners: no "advanced" moves. Include at least one recovery/mobility day. Each day: 3–8 main exercises (warm-up and cool-down are added automatically, don't include them). sets 1–5. dose like "8–12 reps", "30 s" or "15 min".
${lib}

Return ONLY JSON in this exact shape:
{"profile":{"age":16,"goal":"muscle|fat|endurance|mobility|general","level":"beginner|intermediate|advanced","equip":"none|db|gym","minutes":30},"summary":"2-3 friendly sentences explaining the plan, addressed to them","days":[{"title":"Arm Day","recovery":false,"ex":[{"id":"pushup","sets":3,"dose":"8–12 reps"}]}]}`;
  try{const j=await SAMPLE.json(prompt,{cache:false});const plan=validatePlan(j);a.t=plan.summary;a.plan=plan}
  catch(e){const pl=offlinePlan();a.t=pl.summary;a.plan=pl;a.off=1}
  a.pending=0;busy=false;SFX.reply();save();if(tab==='skeefo')render();
}
function validatePlan(j){
  if(!j||!Array.isArray(j.days)||j.days.length<7)throw new Error('bad_plan');
  const pr=j.profile||{},cur=S.profile;
  const profile={age:Math.max(13,Math.min(95,parseInt(pr.age)||cur.age)),goal:GOALS[pr.goal]?pr.goal:cur.goal,level:LEVELS[pr.level]?pr.level:cur.level,equip:EQUIP[pr.equip]?pr.equip:cur.equip,minutes:Math.max(15,Math.min(60,Math.round((parseInt(pr.minutes)||cur.minutes)/5)*5))};
  const eqOK=profile.equip==='gym'?['none','db','gym']:profile.equip==='db'?['none','db']:['none'];
  const ok=e=>e&&eqOK.includes(e.eq)&&!(profile.age<18&&e.heavy)&&!(profile.age>=55&&e.imp)&&!(profile.level==='beginner'&&e.hard);
  const days=j.days.slice(0,7).map(d=>{const seen=new Set();
    const ex=(Array.isArray(d.ex)?d.ex:[]).filter(x=>x&&ok(EXI[x.id])&&!seen.has(x.id)&&seen.add(x.id)).slice(0,9)
      .map(x=>({id:x.id,sets:Math.max(1,Math.min(5,parseInt(x.sets)||2)),dose:String(x.dose||'').slice(0,18)||null}));
    return{title:dayName(ex,!!d.recovery),recovery:!!d.recovery,ex}});
  if(days.filter(d=>d.ex.length>=2).length<4)throw new Error('bad_plan');
  return{profile,summary:String(j.summary||'Here’s your new 7-day plan.').slice(0,600),days};
}
async function buildSched(){
  if(busy)return;if(!useClaude())return offlineBuild('sched');
  const parent=R0()==='parent';
  const wantTimes=S.chat.filter(m=>m.r==='u').slice(-6).some(m=>/\b(times?|timed|time ?frames?|o ?clock)\b|\d{1,2}(:\d{2})?\s*(am|pm)\b/i.test(m.t));
  busy=true;S.chat.push({r:'u',t:parent?'Build a daily schedule for my kid':'Build my daily schedule'});const a={r:'a',t:'',pending:1};S.chat.push(a);render();scrollChat();
  const prompt=`${persona()}

Conversation so far:
${transcript()}

TASK: Build a realistic daily schedule ${parent?'for the parent’s kid':'for this person'} from what you know, filling gaps with sensible defaults (school-age kids: about 9 hours of sleep, homework time, screen-off time before bed). Group tasks into 3–6 sections (like Morning, School, After school, Evening). 2–7 tasks per section. Each task: short title (max 40 chars), ${wantTimes?'"time" as 24-hour "HH:MM" (they asked for times) or "" if flexible':'"time" set to "" for EVERY task (they did not ask for times; order the tasks through the day instead)'}, and "min" for how many minutes it should take (1–240). Include exactly one task titled "Workout" at a sensible point in the day with min equal to the workout length (${S.profile.minutes} min if unknown). Don't include school classes as separate tasks; one "School" task is enough.

Return ONLY JSON in this exact shape:
{"summary":"2 friendly sentences about the schedule","sections":[{"name":"Morning","tasks":[{"title":"Wake up and make your bed","time":"${wantTimes?'07:00':''}","min":5}]}]}`;
  try{const j=await SAMPLE.json(prompt,{cache:false});const sc=validateSched(j,wantTimes);a.t=sc.summary;a.sched=sc}
  catch(e){const sc=offlineSched(wantTimes);a.t=sc.summary;a.sched=sc;a.off=1}
  a.pending=0;busy=false;SFX.reply();save();if(tab==='skeefo')render();
}
function validateSched(j,wantTimes){
  if(!j||!Array.isArray(j.sections)||!j.sections.length)throw new Error('bad_sched');
  let hasW=false;
  const sections=j.sections.slice(0,6).map(s=>({id:rid(),name:String(s.name||'Section').slice(0,30),tasks:(Array.isArray(s.tasks)?s.tasks:[]).slice(0,8).map(k=>{
    const title=String(k.title||'').slice(0,40).trim(),time=wantTimes&&/^\d{1,2}:\d{2}$/.test(k.time||'')?String(k.time).padStart(5,'0'):'',min=Math.max(1,Math.min(240,parseInt(k.min)||10));
    if(!hasW&&/^workout$/i.test(title)){hasW=true;return{id:'workout',kind:'workout',title:'Daily workout',time,min}}
    return{id:rid(),title,time,min}}).filter(k=>k.title)})).filter(s=>s.tasks.length);
  if(!sections.length)throw new Error('bad_sched');
  return{summary:String(j.summary||'Here’s a schedule for your day.').slice(0,400),sections};
}

  const a=f.animate([{transform:'translate3d(-50%,8px,0) scale(.5)',opacity:0},{transform:'translate3d(-50%,-26px,0) scale(1.25)',opacity:1,offset:.22},{transform:'translate3d(-50%,-40px,0) scale(1)',opacity:1,offset:.5},{transform:'translate3d(-50%,-84px,0) scale(.95)',opacity:0}],{duration:reduced?300:1300,easing:'cubic-bezier(.16,1,.3,1)'});
  a.onfinish=()=>f.remove()}
function overlay(cls,html,ms){const o=document.createElement('div');o.className='overlay '+cls;o.innerHTML=`<div class="ov">${html}<button class="btn primary" style="margin-top:8px">Continue</button></div>`;
  document.body.appendChild(o);o.animate([{opacity:0},{opacity:1}],{duration:250});
  const close=()=>{const a=o.animate([{opacity:1},{opacity:0}],{duration:200});a.onfinish=()=>o.remove()};
  o.querySelector('button').addEventListener('click',close);o.querySelector('button').focus();if(ms)setTimeout(()=>o.isConnected&&close(),ms)}
function levelUp(L){SFX.levelUp();buzz([30,60,30,60,140]);overlay('lvlup',`<div class="eyebrow">Level up</div><div class="huge num"><span class="rays"></span>${L}</div><h2>${esc(titleFor(L))}</h2><p>${xpFor(L+1)-S.xp} XP to level ${L+1}.</p>`);confetti(1.4)}
function levelDown(d){SFX.levelDown();buzz([120,80,200]);overlay('lvldown',`<div class="eyebrow">Level lost</div><div class="huge num">${d.to}</div><h2>Down from level ${d.from}</h2><p>You missed ${d.missed} days in a row. Finish today’s routine to stop the slide and earn the Comeback badge.</p>`)}
let toastQ=Promise.resolve();
function toast(icon,title,sub){toastQ=toastQ.then(()=>new Promise(res=>{const t=$('#toast');t.innerHTML=`${icon}<div><b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
  t.classList.add('show');setTimeout(()=>{t.classList.remove('show');setTimeout(res,450)},2400)}))}

/* ================= Installed app: reminders, badge, widget data ================= */
const INSTALLED=()=>!!window.RR_STANDALONE&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: window-controls-overlay)').matches||navigator.standalone===true);
const NOTIF={
  timers:[],
  supported:()=>'Notification' in window&&'serviceWorker' in navigator,
  state:()=>!NOTIF.supported()?'unsupported':Notification.permission,
  async enable(){
    if(!NOTIF.supported())return'unsupported';
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p==='granted'){S.notif=true;save();
      try{const reg=await navigator.serviceWorker.ready;if('periodicSync' in reg){await reg.periodicSync.register('rr-remind',{minInterval:60*60*1000}).catch(()=>{})}}catch(e){}
      await NOTIF.sync();try{const reg=await navigator.serviceWorker.ready;reg.showNotification('Reminders are on',{body:'I’ll remind you when things on your schedule are due.',icon:'icon-192.png',badge:'icon-192.png',tag:'rr-hello'})}catch(e){}}
    return p},
  data(){ensureToday();const t=todayKey(),log=S.dayLog[t]||{},R=routine(),rw=RULES().remindWorkout;
    const items=sched().sections.flatMap(x=>x.tasks).map(k=>({id:k.id,title:k.title,time:(k.kind==='workout'&&rw)||k.time||'',done:!!taskState(k,log).d,workout:k.kind==='workout'}));
    const left=items.filter(i=>!i.done).length,w=allItems(R).length;
    return{date:t,items,left,level:lvl(S.xp),title:titleFor(lvl(S.xp)),xp:S.xp,streak:S.streak,notif:!!S.notif&&NOTIF.state()==='granted',
      workoutText:S.today.complete?`${R.title}: done ✓`:`${R.title}: ${S.today.done.length}/${w} moves`,leftText:left?`${left} thing${left>1?'s':''} left today`:'Everything done today!',updated:Date.now()}},
  async sync(){
    if(!INSTALLED())return;const d=NOTIF.data();
    try{const c=await caches.open('rr-data');await c.put('widget/data.json',new Response(JSON.stringify(d),{headers:{'content-type':'application/json'}}))}catch(e){}
    try{if('setAppBadge' in navigator){d.left?navigator.setAppBadge(d.left):navigator.clearAppBadge()}}catch(e){}
    try{navigator.serviceWorker&&navigator.serviceWorker.controller&&navigator.serviceWorker.controller.postMessage({type:'rr-sync'})}catch(e){}
    NOTIF.timers.forEach(clearTimeout);NOTIF.timers=[];
    if(d.notif){const now=Date.now();d.items.filter(i=>!i.done&&i.time).forEach(i=>{const ts=hmToday(i.time);if(ts>now&&ts-now<86400000)NOTIF.timers.push(setTimeout(()=>NOTIF.show(i),ts-now))})}
  },
  async show(i){try{const reg=await navigator.serviceWorker.ready;
    reg.showNotification(i.workout?'Time to train':'Reminder: '+i.title,{body:i.workout?'Your workout is ready. Keep the streak alive!':`It’s ${hm(i.time)}. Tap to check it off.`,icon:'icon-192.png',badge:'icon-192.png',tag:'rr-'+i.id,renotify:false,data:{url:'./#'+(i.workout?'workout':'day')}})}catch(e){}},
};
function remindersCard(){
  if(!window.RR_STANDALONE)return'';
  if(!INSTALLED())return`<section class="card fam-hero"><div class="label">Reminders</div><h3 class="h3">Install the app for reminders</h3>
    <p class="note">Notifications and the icon badge only work in the installed app.</p>
    <ul class="rules"><li><span>1</span><div><b>iPhone:</b> open this page in Safari, tap Share, then <b>Add to Home Screen</b>. Open it from your home screen.</div></li><li><span>2</span><div><b>Android:</b> open it in Chrome, tap ⋮, then <b>Install app</b>.</div></li></ul></section>`;
  const st=NOTIF.state();
  if(st==='unsupported')return`<section class="card"><div class="label">Reminders</div><h3 class="h3">Not supported on this phone</h3><p class="note">Your phone’s browser doesn’t allow app notifications. On iPhone you need iOS 16.4 or newer.</p></section>`;
  const on=st==='granted'&&S.notif;
  return`<section class="card ${on?'':'fam-hero'}"><div class="label">Reminders</div><h3 class="h3">${on?'Reminders are on':'Turn on reminders'}</h3>
    <p class="note">${on?'You’ll get a notification when a timed task or your workout is due, and the app icon shows how many things are left today.':st==='denied'?'Notifications are blocked. Turn them on for this app in your phone’s Settings, then come back.':'Get a notification when tasks with a time and your workout are due. Only tasks that have a time can remind you.'}</p>
    <p class="note" style="font-size:12px">Reminders are most reliable when the app is still open in the background. Android can also check in now and then while it’s closed.</p>
    ${on?`<button class="btn sm ghost" data-act="notifoff">Turn off reminders</button>`:st==='denied'?'':`<button class="btn primary" data-act="notifon">Turn on reminders</button>`}</section>`;
}
/* ================= Boot ================= */
function boot(withDecay=true,quiet=false){
  ensureToday();
  if(!busy&&(S.chat||[]).length){archiveChat();save()}
  const d=withDecay&&R0()==='me'?applyDecay():null;
  if(d)save();
  {const h=location.hash.slice(1);if(h&&(TABS.me.some(([k])=>k===h)||h==='newtab'))tab=h}
  renderTabs();render();renderHeader();try{NOTIF.sync()}catch(e){}
  if(d&&d.to)setTimeout(()=>levelDown(d),400);
  else if(d&&d.broke&&!quiet)toast(medal('0',false),'Streak reset','You missed two days in a row.');
}
boot();
connect();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.today&&S.today.date!==todayKey())boot()});
</script>
